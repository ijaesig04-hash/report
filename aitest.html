<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f2350">
<title>🧪 AI 비교 시험 · 북서울 Report</title>
<style>
:root{--navy:#0f2350;--blue:#1f4fd8;--g:#1a73e8;--c:#c96442;--ink:#16203a;--mute:#5d6879;--line:#dde3ee;--bg:#eef2f8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'Noto Sans KR','Apple SD Gothic Neo',sans-serif;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;cursor:pointer;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:max(12px,env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;gap:10px}
.top b{flex:1;font-size:17px}
.back{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;width:40px;height:36px;font-size:20px}
main{max-width:560px;margin:0 auto;padding:14px 14px 60px}
.hero{border-radius:18px;padding:15px 16px;color:#fff;background:linear-gradient(120deg,#1a73e8 0%,#5b3fd1 50%,#c96442 100%);box-shadow:0 10px 26px rgba(31,79,216,.22)}
.hero h1{margin:0;font-size:18px}.hero p{margin:4px 0 0;font-size:12.5px;opacity:.9}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#e3e9f3;border-radius:13px;padding:4px;margin:12px 0}
.seg button{border:0;background:none;border-radius:10px;padding:8px 0;font-weight:800;color:var(--mute);font-size:13.5px}
.seg button[aria-pressed=true]{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px}
label{display:block;font-size:12.5px;font-weight:800;color:var(--mute);margin:10px 2px 5px}
textarea,input,select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:15px/1.5 inherit;font-family:inherit;background:#fff}
textarea{min-height:84px;resize:vertical}
.row{display:flex;gap:8px}.row>*{flex:1}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick button{border:1px solid var(--line);background:#f5f7fb;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.pick button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.go{width:100%;border:0;border-radius:15px;padding:14px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(120deg,#1a73e8,#5b3fd1 55%,#c96442);margin-top:12px}
.go:disabled{opacity:.5}
.note{font-size:12px;color:var(--mute);margin:8px 2px 0}
.res{display:grid;gap:12px}
.ai{border-radius:18px;background:#fff;border:2px solid var(--line);padding:13px}
.ai.g{border-color:#a8c7fa}.ai.c{border-color:#f0b9a3}
.ai .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ai .hd b{font-size:15px}.ai.g .hd b{color:var(--g)}.ai.c .hd b{color:var(--c)}
.ai .hd span{margin-left:auto;font-size:11.5px;color:var(--mute);font-weight:700;text-align:right}
.ai .t{font-weight:800;font-size:15px;margin:2px 0 6px}
.ai .a{white-space:pre-line;font-size:14px;line-height:1.65}
.ai ol{margin:6px 0 0;padding-left:20px;font-size:13.5px}
.ai .cu{background:#f5f7fb;border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:14.5px}
.ai .tip{margin-top:8px;font-size:12.5px;color:#92400e;background:#fffbeb;border-radius:10px;padding:6px 10px}
.ai .er{color:#9f1239;font-size:13.5px}
.vote{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:4px}
.vote button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 0;font-weight:800;font-size:13px}
.vote button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tally{font-size:13px;color:var(--navy);font-weight:800;text-align:center;margin-top:8px}
.load{text-align:center;padding:22px;color:var(--mute);font-weight:700}
.hist .cu{font-size:13px;margin:4px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="top"><button class="back" type="button" onclick="history.length>1?history.back():location.href='./'" aria-label="뒤로">‹</button><b>🧪 AI 비교 시험</b><span style="font-size:12px;opacity:.8">파트장 전용</span></div>
<main>
  <div class="hero"><h1>Gemini vs Claude, 같은 질문 비교</h1><p>직원 화면은 그대로 Gemini · 시험 질문은 기록 안 남음</p></div>
  <div class="card" id="pinbox" hidden>
    <h2>🔒 파트장 비밀번호</h2>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="AI 응대 파트장 비밀번호">
    <button class="go" type="button" id="pinok">확인</button>
  </div>
  <div id="app" hidden>
    <div class="seg" id="seg"><button type="button" data-w="diag" aria-pressed="true">📸 현장 진단</button><button type="button" data-w="chat" aria-pressed="false">🎧 고객 응대</button></div>
    <div class="card" id="fDiag">
      <h2>현장 진단 질문</h2>
      <textarea id="q" placeholder="예) 세콤듀얼R 출입제어기R에 통신이상(CM) 떠요. 카드가 안 먹어요"></textarea>
      <label>사진 (선택)</label>
      <input type="file" id="img" accept="image/*">
    </div>
    <div class="card" id="fChat" hidden>
      <h2>고객 응대 한 마디 비교</h2>
      <label>상황</label>
      <div class="pick" id="scp"></div>
      <label>고객 첫마디</label>
      <div class="cu" id="open" style="background:#f5f7fb;border-radius:12px;padding:9px 12px;font-size:14px"></div>
      <label>내(직원) 답변</label>
      <textarea id="say" placeholder="예) 기다리시게 해서 정말 죄송합니다. 지금 바로 기사님 위치 확인해 드리겠습니다."></textarea>
    </div>
    <div class="card">
      <h2>Claude 모델</h2>
      <div class="pick" id="cmp"><button type="button" data-m="haiku" aria-pressed="true">Haiku (싸고 빠름)</button><button type="button" data-m="sonnet" aria-pressed="false">Sonnet (더 똑똑 · 비쌈)</button></div>
      <button class="go" type="button" id="go">두 AI에 같이 물어보기</button>
      <p class="note">두 AI에 한 번씩 물어서 질문 한 번에 양쪽 요금이 다 나가요.</p>
    </div>
    <div id="out"></div>
    <div class="card" id="score">
      <h2>지금까지 내 평가</h2>
      <div class="tally" id="tally"></div>
    </div>
  </div>
</main>
<script>
var API = "https://script.google.com/macros/s/AKfycby7Ggvk7-rHHPYtIia_19uj33TbfJUDefRic63OBz0ifkd7hoOSs1HQ06gkQmNRlTcG/exec";
var SC = [{"id": "bill", "title": "요금 청구에 불만인 고객", "persona": "이번 달 청구 금액이 평소보다 많이 나왔다. 미리 안내받은 기억이 없어서 '몰래 올린 것 아니냐'고 의심한다. 청구 내역을 쉽게 설명해 주기를 원하고, 잘못 청구된 것이면 바로 정정을 요구한다. 어려운 용어로 말하거나 '규정상 그렇다'고만 하면 화를 낸다. 내역을 확인해 다시 연락 주겠다는 구체적인 약속에는 수긍한다.", "open": "이번 달 요금이 왜 이렇게 많이 나왔어요? 아무 말도 없이 올린 거예요?"}, {"id": "no-show", "title": "방문 약속을 어긴 데 항의", "persona": "오후 2시에 점검 기사가 오기로 해서 가게 문을 닫지도 못하고 기다렸는데 4시가 되도록 연락 한 통 없다. 늦는 것보다 미리 연락이 없었던 것에 더 화가 났다. 자기 시간을 무시당했다고 느낀다. 사과와 함께 지금 당장 언제 올 수 있는지 확실한 시간을 원한다.", "open": "2시에 온다고 해서 계속 기다렸는데 지금 4시예요. 전화 한 통이 없어요. 사람 시간을 이렇게 우습게 봐도 돼요?"}, {"id": "senior", "title": "어르신 장비 사용법 문의", "persona": "70대 어르신 고객. 집에 들어올 때 경비 해제하는 법을 자꾸 헷갈려 경보가 울릴까 봐 불안하다. 말이 느리고, '세트·해제·리더기' 같은 용어가 어려우면 못 알아듣는다. 쉬운 말로 천천히, 한 번에 한 가지씩 설명해 주기를 바란다. 빨리 말하거나 한꺼번에 설명하면 '뭐라고요?' 하고 되묻는다. 친절하면 고마워한다.", "open": "여보세요… 내가 그 기계를 자꾸 잘못 눌러서요. 집에 들어오면 뭘 먼저 눌러야 하는지 모르겠어요."}];
function $(i){ return document.getElementById(i); }
function esc(x){ return String(x==null?"":x).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]}); }
var PIN=""; try{ PIN=sessionStorage.getItem("rp_pin")||""; }catch(e){}
var W="diag", CM="haiku", SI=0, IMG="";
function tally(){ var t={g:0,c:0,s:0}; try{ t=JSON.parse(localStorage.getItem("aicmp_tally")||'{"g":0,"c":0,"s":0}'); }catch(e){} return t; }
function drawTally(){ var t=tally(), n=t.g+t.c+t.s; $("tally").innerHTML = n ? 'Gemini 승 '+t.g+' · Claude 승 '+t.c+' · 비슷 '+t.s+' <span style="color:#5d6879;font-weight:600">(총 '+n+'회)</span>' : '아직 평가한 질문이 없어요'; }
function start(){ $("pinbox").hidden=true; $("app").hidden=false; drawSc(); drawTally(); }
if(PIN) start(); else $("pinbox").hidden=false;
$("pinok").onclick=function(){ var p=$("pin").value.trim(); if(!p) return; PIN=p; try{ sessionStorage.setItem("rp_pin",p); }catch(e){} start(); };
$("seg").onclick=function(e){ var b=e.target.closest("[data-w]"); if(!b) return; W=b.dataset.w; [].forEach.call(this.children,function(x){ x.setAttribute("aria-pressed", x===b); }); $("fDiag").hidden=W!=="diag"; $("fChat").hidden=W!=="chat"; $("out").innerHTML=""; };
$("cmp").onclick=function(e){ var b=e.target.closest("[data-m]"); if(!b) return; CM=b.dataset.m; [].forEach.call(this.children,function(x){ x.setAttribute("aria-pressed", x===b); }); };
function drawSc(){ $("scp").innerHTML=SC.map(function(s,i){ return '<button type="button" data-i="'+i+'" aria-pressed="'+(i===SI)+'">'+esc(s.title)+'</button>'; }).join(""); $("open").textContent="🗣️ "+SC[SI].open; }
$("scp").onclick=function(e){ var b=e.target.closest("[data-i]"); if(!b) return; SI=+b.dataset.i; drawSc(); };
$("img").onchange=function(){ var f=this.files[0]; IMG=""; if(!f) return; var rd=new FileReader(); rd.onload=function(){ var im=new Image(); im.onload=function(){ var s=Math.min(1,1280/Math.max(im.width,im.height)), cv=document.createElement("canvas"); cv.width=im.width*s; cv.height=im.height*s; cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height); IMG=cv.toDataURL("image/jpeg",.82); }; im.src=rd.result; }; rd.readAsDataURL(f); };
function won(u){ if(!u) return ""; return " · 토큰 "+(u.input_tokens||0).toLocaleString()+"+"+(u.output_tokens||0).toLocaleString(); }
function box(k,x,what){
  var name=k==="g"?"Gemini":"Claude", cls=k;
  var h='<div class="ai '+cls+'"><div class="hd"><b>'+(k==="g"?"🔷":"🟠")+' '+name+'</b><span>'+(x&&x.ms?(x.ms/1000).toFixed(1)+'초':'')+(x&&x.model?'<br>'+esc(x.model):'')+(k==="c"&&x&&x.use?won(x.use):"")+'</span></div>';
  if(!x||!x.ok){ var m=x&&x.err==="nokey"?"Claude 열쇠(CLAUDE_TEST_KEY)가 아직 없어요. 아래 안내대로 넣으면 바로 비교돼요.":(x&&(x.err||(x.r&&x.r.err)))||"답을 받지 못했어요"; return h+'<div class="er">⚠️ '+esc(m)+'</div></div>'; }
  var r=x.r||{};
  if(what==="diag"){
    h+='<div class="t">'+esc(r.title||r.device||"")+'</div>';
    if((r.causes||[]).length) h+='<div style="font-size:13px;color:#5d6879"><b>예상 원인</b> · '+r.causes.slice(0,2).map(function(c){return esc(c.c||c)}).join(" / ")+'</div>';
    if(r.answer) h+='<div class="a" style="margin-top:6px">'+esc(r.answer)+'</div>';
    if((r.steps||[]).length) h+='<ol>'+r.steps.slice(0,6).map(function(s){return '<li>'+esc(s)+'</li>'}).join("")+'</ol>';
    if(r.say) h+='<div class="tip" style="background:#ecfdf5;color:#065f46">💬 '+esc(r.say)+'</div>';
    h+='<div style="font-size:11.5px;color:#8a94a6;margin-top:6px">확신도 '+(r.conf||0)+'%'+((r.refs||[]).length?' · 근거: '+esc(r.refs.slice(0,2).join(", ")):'')+'</div>';
  } else {
    h+='<div class="cu">🗣️ '+esc(r.customer||"")+'</div>'+(r.tip?'<div class="tip">💡 코치 팁: '+esc(r.tip)+'</div>':'');
  }
  return h+'</div>';
}
$("go").onclick=function(){
  var body={act:"cmp",pin:PIN,what:W,cmodel:CM};
  if(W==="diag"){ body.q=$("q").value.trim(); if(IMG) body.imgs=[IMG]; if(!body.q&&!IMG){ alert("질문이나 사진을 넣어 주세요"); return; } }
  else { var s=SC[SI], say=$("say").value.trim(); if(!say){ alert("직원 답변을 적어 주세요"); return; } body.persona=s.persona; body.level="중"; body.hist=[{r:"c",t:s.open},{r:"s",t:say}]; }
  var b=this; b.disabled=true; $("out").innerHTML='<div class="card load">🤖 두 AI에 묻는 중… (20~40초)</div>';
  fetch(API,{method:"POST",body:JSON.stringify(body)}).then(function(r){return r.json()}).then(function(j){
    b.disabled=false;
    if(!j||!j.ok){ if(j&&j.err==="pin"){ try{sessionStorage.removeItem("rp_pin")}catch(e){} PIN=""; $("app").hidden=true; $("pinbox").hidden=false; } $("out").innerHTML='<div class="card er" style="color:#9f1239">'+(j&&j.err==="pin"?"비밀번호가 맞지 않아요":"불러오지 못했어요: "+esc(j&&j.err||""))+'</div>'; return; }
    $("out").innerHTML='<div class="res">'+box("g",j.gemini,j.what)+box("c",j.claude,j.what)+'</div>'+
      (j.hasKey?'<div class="card" style="margin-top:12px"><h2>어느 답이 더 나았나요?</h2><div class="vote" id="vote"><button type="button" data-v="g">🔷 Gemini</button><button type="button" data-v="s">비슷해요</button><button type="button" data-v="c">🟠 Claude</button></div></div>':
       '<div class="card" style="margin-top:12px"><h2>🔑 Claude 열쇠 넣는 법</h2><ol style="margin:0;padding-left:20px;font-size:13.5px"><li>platform.claude.com 가입 → Billing에서 크레딧 충전 (최소 5달러)</li><li>API Keys → Create Key → 열쇠 복사</li><li>Apps Script → ⚙️ 프로젝트 설정 → 스크립트 속성 추가<br>이름: <b>CLAUDE_TEST_KEY</b> / 값: 복사한 열쇠</li><li>저장 후 이 화면에서 다시 물어보기 (재배포 필요 없음)</li></ol></div>');
    var v=$("vote"); if(v) v.onclick=function(e){ var x=e.target.closest("[data-v]"); if(!x||v.dataset.done) return; v.dataset.done=1; x.classList.add("on"); var t=tally(); t[x.dataset.v]++; try{ localStorage.setItem("aicmp_tally",JSON.stringify(t)); }catch(_){} drawTally(); };
  }).catch(function(){ b.disabled=false; $("out").innerHTML='<div class="card" style="color:#9f1239">연결이 끊겼어요. 다시 눌러 주세요.</div>'; });
};
</script>
</body>
</html>

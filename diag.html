<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f2350">
<title>AI 현장 진단 · 북서울 Report</title>
<style>
:root{--navy:#0f2350;--blue:#1f4fd8;--red:#e4002b;--ink:#16203a;--mute:#5d6879;--line:#dde3ee;--bg:#eef2f8;--ok:#14804a;--amb:#b45309}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'Noto Sans KR','Apple SD Gothic Neo',sans-serif;word-break:keep-all;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:max(12px,env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;gap:10px}
.top b{flex:1;font-size:17px}
.top .me{font-size:12.5px;opacity:.8}
.back{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;width:40px;height:36px;font-size:20px}
main{max-width:560px;margin:0 auto;padding:14px 14px 80px}
.hero{border-radius:20px;padding:18px 16px;color:#fff;background:linear-gradient(135deg,#0f2350 0%,#1f4fd8 60%,#0ea5e9 100%);box-shadow:0 10px 26px rgba(31,79,216,.25);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero h1{margin:0;font-size:21px;letter-spacing:-.02em}
.hero p{margin:6px 0 0;font-size:13.5px;opacity:.9;line-height:1.55}
.hero .flow{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.hero .flow span{background:rgba(255,255,255,.16);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#dfe6f2;border-radius:14px;padding:4px;margin:14px 0 12px}
.seg button{border:0;background:none;border-radius:11px;padding:9px 0;font-weight:800;color:var(--mute)}
.seg button[aria-pressed=true]{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.card h2{font-size:15.5px;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shot{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:#f3f6fb;border:1.5px dashed #b9c6dc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mute);font-size:12px;font-weight:700}
.shot i{font-style:normal;font-size:26px}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot .x{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:13px;line-height:24px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
.chips button{border:1px solid var(--line);background:#f7f9fd;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;color:#334155}
.chips button.on{background:#e8efff;border-color:#9db4f5;color:var(--blue)}
textarea{width:100%;min-height:64px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:14px/1.5 inherit;font-family:inherit;resize:vertical}
.go{width:100%;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(120deg,#1f4fd8,#0ea5e9);box-shadow:0 8px 20px rgba(31,79,216,.28)}
.go:disabled{opacity:.45;box-shadow:none}
.hint{font-size:12px;color:var(--mute);margin:8px 2px 0;text-align:center}
.load{text-align:center;padding:26px 10px}
.scan{width:120px;height:120px;margin:0 auto 12px;border-radius:20px;background:#0f2350 center/cover;position:relative;overflow:hidden;box-shadow:0 8px 22px rgba(15,35,80,.3)}
.scan:after{content:"";position:absolute;left:0;right:0;height:3px;background:#38bdf8;box-shadow:0 0 12px 3px #38bdf8;animation:sc 1.6s ease-in-out infinite}
@keyframes sc{0%{top:0}50%{top:calc(100% - 3px)}100%{top:0}}
.load ol{list-style:none;padding:0;margin:8px auto 0;max-width:250px;text-align:left;font-size:13px;color:var(--mute)}
.load li{padding:3px 0}.load li.on{color:var(--blue);font-weight:800}.load li.ok{color:var(--ok)}
.rh{display:flex;gap:12px;align-items:center}
.rh .ic{flex:none;width:52px;height:52px;border-radius:16px;background:#e8efff;display:flex;align-items:center;justify-content:center;font-size:27px}
.rh b{display:block;font-size:17px;line-height:1.35}
.rh small{color:var(--mute);font-size:12.5px}
.conf{margin-top:10px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);font-weight:700}
.conf i{flex:1;height:8px;border-radius:99px;background:#e5eaf3;overflow:hidden;display:block}
.conf i em{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#f59e0b,#22c55e)}
.seen{margin-top:10px;background:#f5f7fb;border-radius:12px;padding:9px 11px;font-size:13px;color:#334155}
.cz{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid #eef1f6;font-size:14px}
.cz:first-of-type{border-top:0}
.pb{flex:none;font-size:11px;font-weight:800;border-radius:7px;padding:1px 7px;margin-top:2px}
.pb.h{background:#fee2e2;color:#b91c1c}.pb.m{background:#fef3c7;color:#92400e}.pb.l{background:#e5e7eb;color:#475569}
.st{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:8px 0;border-top:1px solid #eef1f6;font-size:14px}
.st:first-of-type{border-top:0}
.st em{flex:none;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-style:normal;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
.st.done{color:#94a3b8;text-decoration:line-through}.st.done em{background:var(--ok)}
.box{border-radius:14px;padding:10px 12px;font-size:13.5px;margin-top:10px;display:flex;gap:8px}
.box i{font-style:normal;flex:none}
.box.call{background:#fff1f2;border:1px solid #fecdd3;color:#9f1239}
.box.safe{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.box.more{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.say{background:linear-gradient(120deg,#ecfdf5,#f0fdfa);border:1px solid #a7f3d0;border-radius:14px;padding:11px 12px;font-size:14px;color:#065f46}
.say button{margin-top:8px;border:0;background:#059669;color:#fff;border-radius:10px;padding:6px 12px;font-size:12.5px;font-weight:800}
.fb{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fb button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 0;font-weight:800}
.fb button.on{border-color:var(--blue);background:#e8efff;color:var(--blue)}
.fix{display:flex;gap:6px;margin-top:8px}
.fix input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;font:14px inherit;font-family:inherit}
.fix button{flex:none;border:0;border-radius:12px;background:var(--navy);color:#fff;padding:0 14px;font-weight:800}
.again{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px;font-weight:800;color:var(--navy)}
.case{padding:11px 0;border-top:1px solid #eef1f6}
.case:first-child{border-top:0}
.case b{font-size:14px}.case small{display:block;color:var(--mute);font-size:12px}
.case p{margin:4px 0 0;font-size:13px;color:#334155}
.case .fx{display:inline-block;margin-top:5px;background:#ecfdf5;color:#065f46;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.kpi b{display:block;font-size:20px;color:var(--navy)}.kpi span{font-size:11.5px;color:var(--mute);font-weight:700}
.empty{text-align:center;color:var(--mute);font-size:13.5px;padding:18px 6px}
.err{background:#fff1f2;border:1px solid #fecdd3;color:#9f1239;border-radius:14px;padding:12px;font-size:13.5px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="top"><button class="back" type="button" onclick="history.length>1?history.back():location.href='./'" aria-label="뒤로">‹</button><b>📸 AI 현장 진단</b><span class="me" id="me"></span></div>
<main>
  <div class="hero">
    <h1>사진 한 장이면 진단 끝</h1>
    <p>장비 · 표시등 · 에러 화면을 찍으면 AI가 기기와 원인, 현장 조치 순서, 고객 안내 멘트까지 알려줘요.</p>
    <div class="flow"><span>📷 촬영</span><span>🤖 AI 판독</span><span>🛠️ 조치 순서</span><span>📚 사례 축적</span></div>
  </div>
  <div class="seg"><button type="button" data-tab="go" aria-pressed="true">📸 진단하기</button><button type="button" data-tab="cases" aria-pressed="false">📚 지사 사례</button></div>

  <section id="pGo">
    <div id="form">
      <div class="card">
        <h2>① 사진 찍기 <small style="color:var(--mute);font-weight:500;font-size:12px">최대 3장</small></h2>
        <div class="shots" id="shots"></div>
        <input type="file" id="file" accept="image/*" capture="environment" hidden>
        <input type="file" id="file2" accept="image/*" multiple hidden>
        <div class="chips" style="margin-top:10px"><button type="button" id="gal">🖼️ 갤러리에서 고르기</button></div>
      </div>
      <div class="card">
        <h2>② 증상 (선택)</h2>
        <div class="chips" id="chips"></div>
        <textarea id="memo" placeholder="예) 키패드 빨간불 깜빡, 고객이 경계가 안 걸린대요"></textarea>
      </div>
      <button class="go" type="button" id="go" disabled>🤖 AI 진단하기</button>
      <p class="hint">고객 얼굴 · 비밀번호 · 개인정보가 찍히지 않게 해 주세요</p>
    </div>
    <div id="load" class="card load" hidden>
      <div class="scan" id="scan"></div>
      <b>AI가 사진을 판독하고 있어요</b>
      <ol id="steps"><li>📷 사진 분석</li><li>🔍 기기 · 표시등 판독</li><li>📚 지사 사례 대조</li><li>🛠️ 조치 순서 정리</li></ol>
    </div>
    <div id="res" hidden></div>
  </section>

  <section id="pCases" hidden>
    <div class="kpi" id="ck"></div>
    <div class="card" id="clist"><div class="empty">불러오는 중…</div></div>
  </section>
</main>
<script>
var API = "https://script.google.com/macros/s/AKfycby7Ggvk7-rHHPYtIia_19uj33TbfJUDefRic63OBz0ifkd7hoOSs1HQ06gkQmNRlTcG/exec";
var ME = (function(){ try{ var n=localStorage.getItem("bsr_me")||""; return n==="관리자"?"":n; }catch(e){ return ""; } })();
if(ME!=="이재식"){ location.replace("./"); }
document.getElementById("me").textContent = ME ? ME+"님" : "";
var IMGS = [], LAST = null;
var CHIPS = ["표시등 깜빡임","경계 안 걸림","오경보 반복","통신 이상","화면 안 나옴","녹화 안 됨","배터리 경고","문이 안 열림","소리가 남"];
function esc(x){ return String(x==null?"":x).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]}); }
function $(i){ return document.getElementById(i); }

function drawShots(){
  var h = IMGS.map(function(s,i){ return '<div class="shot"><img src="'+s+'" alt="사진 '+(i+1)+'"><button type="button" class="x" data-del="'+i+'" aria-label="지우기">✕</button></div>'; }).join("");
  if(IMGS.length<3) h += '<button type="button" class="shot" id="add"><i>📷</i>'+(IMGS.length?'더 찍기':'촬영')+'</button>';
  for(var k=IMGS.length+1;k<3;k++) h += '<div class="shot" style="border-style:solid;opacity:.45"></div>';
  $("shots").innerHTML = h; $("go").disabled = !IMGS.length;
}
$("chips").innerHTML = CHIPS.map(function(c){ return '<button type="button">'+c+'</button>'; }).join("");
$("chips").addEventListener("click",function(e){ var b=e.target.closest("button"); if(!b) return; b.classList.toggle("on"); });
$("shots").addEventListener("click",function(e){
  var d=e.target.closest("[data-del]"); if(d){ IMGS.splice(+d.dataset.del,1); drawShots(); return; }
  if(e.target.closest("#add")) $("file").click();
});
$("gal").addEventListener("click",function(){ $("file2").click(); });
function shrink(f){ return new Promise(function(ok,no){ var u=URL.createObjectURL(f), im=new Image(); im.onload=function(){ var M=1280, w=im.naturalWidth, h=im.naturalHeight, r=Math.min(1,M/Math.max(w,h)); var c=document.createElement("canvas"); c.width=Math.round(w*r); c.height=Math.round(h*r); c.getContext("2d").drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(u); ok(c.toDataURL("image/jpeg",0.82)); }; im.onerror=no; im.src=u; }); }
function addFiles(fl){ var a=[].slice.call(fl||[]).slice(0,3-IMGS.length); Promise.all(a.map(shrink)).then(function(r){ IMGS=IMGS.concat(r).slice(0,3); drawShots(); }); }
$("file").addEventListener("change",function(){ addFiles(this.files); this.value=""; });
$("file2").addEventListener("change",function(){ addFiles(this.files); this.value=""; });

var TK=null;
$("go").addEventListener("click",function(){
  var chips=[].slice.call(document.querySelectorAll("#chips .on")).map(function(b){return b.textContent});
  var memo=(chips.length?'['+chips.join(', ')+'] ':'')+$("memo").value.trim();
  $("form").hidden=true; $("res").hidden=true; $("load").hidden=false; $("scan").style.backgroundImage='url('+IMGS[0]+')';
  var li=document.querySelectorAll("#steps li"), k=0; li.forEach(function(x){x.className=""}); li[0].className="on";
  TK=setInterval(function(){ if(k<li.length-1){ li[k].className="ok"; k++; li[k].className="on"; } },2200);
  fetch(API,{method:"POST",body:JSON.stringify({act:"diag",name:ME,memo:memo,imgs:IMGS})}).then(function(r){return r.json()}).then(function(j){
    clearInterval(TK); $("load").hidden=true;
    if(!j.ok) throw new Error(j.err||"실패");
    LAST=j; showRes(j);
  }).catch(function(err){ clearInterval(TK); $("load").hidden=true; $("form").hidden=false;
    $("res").hidden=false; $("res").innerHTML='<div class="err">진단을 못 했어요. 인터넷 연결이나 AI 사용량(충전 잔액)을 확인한 뒤 다시 눌러 주세요.<br><small>'+esc(String(err.message||err).slice(0,120))+'</small></div>'; });
});
function pcls(p){ return /높/.test(p)?'h':/보/.test(p)?'m':'l'; }
function showRes(j){
  var conf=Math.max(0,Math.min(100,+j.conf||0));
  var h='<div class="card"><div class="rh"><span class="ic">🔧</span><div><small>AI 판독 결과</small><b>'+esc(j.device||'기기 확인 필요')+'</b></div></div>'+
    '<div class="conf">확신도<i><em style="width:'+conf+'%"></em></i>'+conf+'%</div>'+
    (j.seen?'<div class="seen">👀 '+esc(j.seen)+'</div>':'')+(j.symptom?'<p style="margin:10px 0 0;font-size:14px"><b>증상</b> · '+esc(j.symptom)+'</p>':'')+'</div>';
  if((j.causes||[]).length) h+='<div class="card"><h2>🔍 예상 원인</h2>'+j.causes.map(function(c){ return '<div class="cz"><span class="pb '+pcls(c.p)+'">'+esc(c.p||'')+'</span><span>'+esc(c.c)+'</span></div>'; }).join("")+'</div>';
  if((j.steps||[]).length) h+='<div class="card"><h2>🛠️ 현장 조치 순서 <small style="color:var(--mute);font-weight:500;font-size:12px">누르면 완료 표시</small></h2>'+j.steps.map(function(s,i){ return '<button type="button" class="st"><em>'+(i+1)+'</em><span>'+esc(s)+'</span></button>'; }).join("")+
    (j.call?'<div class="box call"><i>📞</i><span><b>기술팀 · A/S 요청</b><br>'+esc(j.call)+'</span></div>':'')+
    (j.safety?'<div class="box safe"><i>⚠️</i><span>'+esc(j.safety)+'</span></div>':'')+
    (j.more?'<div class="box more"><i>📷</i><span>더 정확히 보려면: '+esc(j.more)+'</span></div>':'')+'</div>';
  if(j.say) h+='<div class="card"><h2>💬 고객 안내 멘트</h2><div class="say" id="say">'+esc(j.say)+'<br><button type="button" id="cp">복사하기</button></div></div>';
  h+='<div class="card"><h2>🙋 이 진단, 도움이 됐나요?</h2><div class="fb"><button type="button" data-fb="도움">👍 도움됐어요</button><button type="button" data-fb="아님">👎 달랐어요</button></div>'+
    '<div class="fix"><input id="fx" placeholder="실제로 해결한 방법 (지사 사례로 남아요)"><button type="button" id="fxs">저장</button></div></div>'+
    '<button class="again" type="button" id="again">📷 다른 장비 진단하기</button>'+
    '<p class="hint">AI 판독은 참고용이에요. 확신도가 낮거나 위험하면 기술팀에 먼저 연락해 주세요.</p>';
  $("res").innerHTML=h; $("res").hidden=false; window.scrollTo(0,0);
}
function fb(o){ o.act="diagfb"; o.no=LAST&&LAST.no; return fetch(API,{method:"POST",body:JSON.stringify(o)}).then(function(r){return r.json()}).catch(function(){return {}}); }
$("res").addEventListener("click",function(e){
  var s=e.target.closest(".st"); if(s){ s.classList.toggle("done"); return; }
  var f=e.target.closest("[data-fb]"); if(f){ document.querySelectorAll("[data-fb]").forEach(function(x){x.classList.toggle("on",x===f)}); fb({ok:f.dataset.fb}); return; }
  if(e.target.id==="cp"){ var t=LAST&&LAST.say||""; (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){ e.target.textContent="복사됐어요 ✓"; }).catch(function(){}); return; }
  if(e.target.id==="fxs"){ var v=$("fx").value.trim(); if(!v) return; e.target.disabled=true; fb({fix:v}).then(function(){ e.target.textContent="저장됨 ✓"; }); return; }
  if(e.target.id==="again"){ IMGS=[]; LAST=null; $("memo").value=""; document.querySelectorAll("#chips .on").forEach(function(b){b.classList.remove("on")}); drawShots(); $("res").hidden=true; $("form").hidden=false; window.scrollTo(0,0); }
});

document.querySelector(".seg").addEventListener("click",function(e){ var b=e.target.closest("[data-tab]"); if(!b) return;
  document.querySelectorAll(".seg button").forEach(function(x){x.setAttribute("aria-pressed",x===b)});
  $("pGo").hidden=b.dataset.tab!=="go"; $("pCases").hidden=b.dataset.tab!=="cases"; if(b.dataset.tab==="cases") loadCases(); });
function loadCases(){
  fetch(API+"?action=diags&t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){
    var R=j.rows||[], okN=R.filter(function(r){return r.ok==="도움"}).length, fxN=R.filter(function(r){return r.fix}).length;
    $("ck").innerHTML='<div><b>'+R.length+'</b><span>진단 사례</span></div><div><b>'+okN+'</b><span>도움됐어요</span></div><div><b>'+fxN+'</b><span>해결 방법 공유</span></div>';
    $("clist").innerHTML = R.length ? R.map(function(r){ var d=new Date(r.t); return '<div class="case"><b>🔧 '+esc(r.dev||'기기')+'</b><small>'+(d.getMonth()+1)+'/'+d.getDate()+' · '+esc(r.name||'')+(r.ok?' · '+(r.ok==="도움"?'👍':'👎'):'')+'</small><p>'+esc(r.sym||'')+(r.cause?' → '+esc(r.cause):'')+'</p>'+(r.fix?'<span class="fx">✅ 실제 해결: '+esc(r.fix)+'</span>':'')+'</div>'; }).join("") : '<div class="empty">아직 진단 사례가 없어요.<br>첫 진단을 해 보세요!</div>';
  }).catch(function(){ $("clist").innerHTML='<div class="empty">사례를 불러오지 못했어요.</div>'; });
}
drawShots();
fetch(API+"?action=ping").catch(function(){});
</script>

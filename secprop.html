<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f2350">
<title>사진 보안 제안 · 북서울 Report</title>
<style>
:root{--navy:#0f2350;--blue:#1f4fd8;--red:#e4002b;--ink:#16203a;--mute:#5d6879;--line:#dde3ee;--bg:#eef2f8;--org:#ea580c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'Noto Sans KR','Apple SD Gothic Neo',sans-serif;word-break:keep-all;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
textarea,.sel{-webkit-user-select:text;user-select:text}
button{font:inherit;cursor:pointer;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:max(12px,env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;gap:10px}
.top b{flex:1;font-size:17px}.top .me{font-size:12.5px;opacity:.8}
.back{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;width:40px;height:36px;font-size:20px}
main{max-width:560px;margin:0 auto;padding:14px 14px 90px}
.hero{border-radius:20px;padding:16px;color:#fff;background:linear-gradient(135deg,#0f2350 0%,#c2410c 70%,#f59e0b 100%);box-shadow:0 10px 26px rgba(194,65,12,.25);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero h1{margin:0;font-size:20px;letter-spacing:-.02em}.hero p{margin:5px 0 0;font-size:13.5px;opacity:.92;line-height:1.55}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}
.card h2{font-size:14px;margin:0 0 10px;color:var(--mute);display:flex;align-items:center;gap:6px}
.card h2 .cp{margin-left:auto;border:1px solid var(--line);background:#f7f9fd;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:800;color:var(--navy)}
.kinds{display:flex;flex-wrap:wrap;gap:6px}
.kinds button{border:1.5px solid var(--line);background:#f7f9fd;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:700;color:#334155}
.kinds button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.shots button{border:2px dashed #fdba74;background:#fff7ed;border-radius:16px;padding:16px 6px;font-weight:800;color:#9a3412;display:flex;flex-direction:column;align-items:center;gap:4px}
.shots button i{font-style:normal;font-size:26px;line-height:1}
.thumbs{display:flex;gap:8px;margin-top:10px}
.thumb{position:relative;width:84px;height:84px;border-radius:12px;overflow:hidden;background:#f3f6fb}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:12px;line-height:22px;padding:0}
textarea{width:100%;min-height:62px;margin-top:10px;border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;font:14.5px/1.55 inherit;font-family:inherit;resize:vertical}
textarea:focus{outline:0;border-color:var(--org)}
.go{width:100%;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(120deg,#c2410c,#f59e0b);box-shadow:0 8px 20px rgba(194,65,12,.28)}
.go:disabled{opacity:.45;box-shadow:none}
.hint{font-size:12.5px;color:var(--mute);text-align:center;margin:8px 0 0}
.key{border:2px solid #fb923c;background:linear-gradient(180deg,#fff7ed,#fff)}
.big{font-size:17px;font-weight:800;line-height:1.5}
.risk{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid #f1f4f8}.risk:first-child{border-top:0}
.lv{flex:none;font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;margin-top:2px;background:#fee2e2;color:#b91c1c}.lv.m{background:#fef3c7;color:#92400e}.lv.l{background:#e2e8f0;color:#475569}
.risk b{display:block;font-size:14.5px}.risk small{display:block;color:var(--mute);font-size:12.5px}
.rec{border:1.5px solid #fed7aa;border-radius:14px;padding:11px 12px;margin-top:8px;background:#fffaf5}
.rec:first-child{margin-top:0}
.rec .hd{display:flex;align-items:center;gap:8px}.rec .hd b{flex:1;font-size:15.5px}
.rec .pr{font-weight:800;color:var(--org);font-size:13.5px;white-space:nowrap}
.rec p{margin:4px 0 0;font-size:13px;color:#57534e}
.rec a{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:800;color:#1f4fd8;text-decoration:none}
.tag{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;background:#dbeafe;color:#1e40af}.tag.s{background:#ede9fe;color:#5b21b6}
.txt{white-space:pre-line;font-size:14.5px}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.acts a,.acts button{border:0;border-radius:12px;padding:9px 14px;font-weight:800;font-size:13.5px;text-decoration:none}
.acts .k{background:#fee500;color:#191919}.acts .s{background:#fef3c7;color:#92400e}
.tip{font-size:12.5px;color:#1e3a8a;background:#eef3ff;border-radius:12px;padding:9px 12px;margin-top:10px}
.note{font-size:12px;color:var(--mute);margin:6px 2px 0}
.load{display:flex;align-items:center;gap:10px;justify-content:center;padding:22px;color:var(--mute);font-weight:700}
.load i{width:18px;height:18px;border-radius:50%;border:3px solid #fed7aa;border-top-color:var(--org);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(15,35,80,.94);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:9;max-width:90%}
</style>
</head>
<body>
<div class="top"><button class="back" type="button" onclick="history.length>1?history.back():location.href='./'" aria-label="뒤로">‹</button><b>📸 사진 보안 제안</b><span class="me" id="me"></span></div>
<main>
  <div class="hero"><h1>사진 한 장이 소개 한 건이 됩니다</h1><p>출입문 · 창문 · 계산대 · 창고를 찍으면 AI가 빈틈과 맞는 에스원 상품, 고객에게 보낼 제안 문자까지 만들어 드려요</p></div>
  <div class="card">
    <h2>어떤 곳인가요?</h2>
    <div class="kinds" id="kinds"></div>
    <div class="shots"><button type="button" id="cam"><i>📷</i>촬영하기</button><button type="button" id="gal"><i>🖼️</i>앨범에서</button></div>
    <input type="file" id="file" accept="image/*" capture="environment" hidden><input type="file" id="file2" accept="image/*" multiple hidden>
    <div class="thumbs" id="thumbs" hidden></div>
    <textarea id="memo" maxlength="400" placeholder="고객이 걱정한 점 (선택) — 예) 밤에 택배 도난이 걱정된대요"></textarea>
  </div>
  <button type="button" class="go" id="go" disabled>AI 보안 제안 받기 →</button>
  <p class="hint">사진은 3장까지 · 사람 얼굴은 안 나오게 찍어 주세요 · 사진은 저장하지 않아요</p>
  <div id="res"></div>
</main>
<script>
var API = "https://script.google.com/macros/s/AKfycby7Ggvk7-rHHPYtIia_19uj33TbfJUDefRic63OBz0ifkd7hoOSs1HQ06gkQmNRlTcG/exec";
var MALL = "https://m.s1directmall.co.kr/", PURL = {"AI 도어캠":"https://m.s1directmall.co.kr/product/ai%EB%8F%84%EC%96%B4%EC%BA%A0/49/category/46/display/1/","AI 홈카메라":"https://m.s1directmall.co.kr/product/ai%ED%99%88%EC%B9%B4%EB%A9%94%EB%9D%BC/76/category/46/display/1/"};
var ME = (function(){ try{ var n=localStorage.getItem("bsr_me")||""; return n==="관리자"?"":n; }catch(e){ return ""; } })();
function $(i){ return document.getElementById(i); }
function esc(x){ return String(x==null?"":x).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]}); }
function toast(m){ var t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(function(){ t.remove(); },2400); }
$("me").textContent = ME ? ME+"님" : "";
var KINDS=["🏪 매장","🏠 주택","🏢 사무실","📦 창고","🏫 학교·기관","🍽️ 식당","🔧 기타"], S={kind:"🏪 매장",imgs:[],busy:false}, LAST={};
function drawKinds(){ $("kinds").innerHTML=KINDS.map(function(k){ return '<button type="button" aria-pressed="'+(k===S.kind)+'">'+k+'</button>'; }).join(""); }
drawKinds();
$("kinds").addEventListener("click",function(e){ var b=e.target.closest("button"); if(!b) return; S.kind=b.textContent; drawKinds(); });
function canGo(){ $("go").disabled = S.busy || !S.imgs.length; }
function drawThumbs(){ $("thumbs").hidden=!S.imgs.length; $("thumbs").innerHTML=S.imgs.map(function(s,i){ return '<div class="thumb"><img src="'+s+'" alt="사진 '+(i+1)+'"><button type="button" class="x" data-del="'+i+'" aria-label="지우기">✕</button></div>'; }).join(""); canGo(); }
$("thumbs").addEventListener("click",function(e){ var d=e.target.closest("[data-del]"); if(d){ S.imgs.splice(+d.dataset.del,1); drawThumbs(); } });
$("cam").addEventListener("click",function(){ if(S.imgs.length>=3) return toast("사진은 3장까지예요"); $("file").click(); });
$("gal").addEventListener("click",function(){ if(S.imgs.length>=3) return toast("사진은 3장까지예요"); $("file2").click(); });
function shrink(f){ return new Promise(function(ok,no){ var u=URL.createObjectURL(f), im=new Image(); im.onload=function(){ var M=1280, w=im.naturalWidth, h=im.naturalHeight, r=Math.min(1,M/Math.max(w,h)); var c=document.createElement("canvas"); c.width=Math.round(w*r); c.height=Math.round(h*r); c.getContext("2d").drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(u); ok(c.toDataURL("image/jpeg",0.82)); }; im.onerror=no; im.src=u; }); }
function addFiles(fl){ var a=[].slice.call(fl||[]).slice(0,3-S.imgs.length); Promise.all(a.map(shrink)).then(function(r){ S.imgs=S.imgs.concat(r).slice(0,3); drawThumbs(); }).catch(function(){ toast("사진을 불러오지 못했어요"); }); }
$("file").addEventListener("change",function(){ addFiles(this.files); this.value=""; });
$("file2").addEventListener("change",function(){ addFiles(this.files); this.value=""; });

function copy(t){ (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(function(){ toast("복사했어요 · 카톡에 붙여 넣으세요"); }).catch(function(){ var a=document.createElement("textarea"); a.value=t; document.body.appendChild(a); a.select(); try{ document.execCommand("copy"); toast("복사했어요"); }catch(e){} a.remove(); }); }
function link(n){ for(var k in PURL){ if(String(n).indexOf(k)>=0) return PURL[k]; } return MALL; }
function draw(j){
  LAST=j; var pc=function(p){ return p==="높음"?"":p==="보통"?" m":" l"; };
  var h='<div class="card key"><h2>📍 현장 요약</h2><div class="big sel">'+esc(j.place||"")+'</div>'+(j.ok?'<p class="note">👍 '+esc(j.ok)+'</p>':'')+'</div>';
  if((j.risks||[]).length) h+='<div class="card"><h2>🔎 보안 빈틈</h2>'+j.risks.map(function(r){ return '<div class="risk"><span class="lv'+pc(r.lv)+'">'+esc(r.lv||"")+'</span><span><b>'+esc(r.spot||"")+'</b><small>'+esc(r.why||"")+'</small></span></div>'; }).join("")+'</div>';
  if((j.recs||[]).length) h+='<div class="card"><h2>🛡️ 추천 상품</h2>'+j.recs.map(function(r){ var dm=r.kind!=="세콤 상담";
    return '<div class="rec"><div class="hd"><span class="tag'+(dm?'':' s')+'">'+(dm?'다이렉트몰':'세콤 상담')+'</span><b>'+esc(r.name||"")+'</b><span class="pr">'+esc(r.price||"")+'</span></div><p>'+esc(r.why||"")+'</p>'+(dm?'<a href="'+link(r.name)+'" target="_blank" rel="noopener">다이렉트몰에서 보기 ›</a>':'')+'</div>'; }).join("")+
    '<div class="tip">💳 다이렉트몰은 결제 페이지 할인코드 칸에 <b>사번</b>을 넣으면 10% 더 할인돼요 · 세콤 상품은 영업팀에 소개 연결</div></div>';
  if(j.talk) h+='<div class="card"><h2>🗣️ 고객에게 이렇게 말해 보세요</h2><div class="txt sel">'+esc(j.talk)+'</div></div>';
  if(j.kakao) h+='<div class="card"><h2>💬 카톡 제안 문자<button type="button" class="cp" data-cp="1">복사</button></h2><div class="txt sel">'+esc(j.kakao)+'</div><div class="acts">'+(navigator.share?'<button type="button" class="k" data-share="1">카톡으로 보내기</button>':'<button type="button" class="k" data-cp="1">복사해서 카톡에</button>')+'<a class="s" href="sms:?body='+encodeURIComponent(j.kakao)+'">✉️ 문자로</a></div></div>';
  h+='<p class="note">AI 제안은 참고용이에요 · 가격은 다이렉트몰·영업팀에서 한 번 더 확인해 주세요</p>';
  $("res").innerHTML=h; $("res").scrollIntoView({behavior:"smooth",block:"start"});
}
$("res").addEventListener("click",function(e){
  if(e.target.closest("[data-cp]")){ copy(LAST.kakao||""); return; }
  if(e.target.closest("[data-share]")){ navigator.share({text:LAST.kakao||""}).catch(function(){}); }
});
$("go").addEventListener("click",function(){
  if(S.busy||!S.imgs.length) return; S.busy=true; canGo();
  $("res").innerHTML='<div class="card"><div class="load"><i></i>사진을 보고 보안 빈틈을 찾는 중… (15초 안팎)</div></div>';
  fetch(API,{method:"POST",body:JSON.stringify({act:"secprop",name:ME,kind:S.kind.replace(/^\S+\s/,""),memo:$("memo").value.trim(),imgs:S.imgs})})
    .then(function(r){return r.json()}).then(function(j){
      if(!j||!j.ok){ $("res").innerHTML='<div class="card"><p style="margin:0">잠시 후 다시 해 주세요. ('+esc((j&&j.err)||"연결 오류")+')</p></div>'; return; }
      draw(j);
    }).catch(function(){ $("res").innerHTML='<div class="card"><p style="margin:0">인터넷 연결을 확인하고 다시 해 주세요.</p></div>'; })
    .then(function(){ S.busy=false; canGo(); });
});
</script>
</body>
</html>

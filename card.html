<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=6,user-scalable=yes">
<meta name="robots" content="noindex,nofollow">
<title>에스원 다이렉트몰 안내 카드</title>
<style>
html,body{margin:0;background:#0a1a3a;color:#fff;font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:12px 12px 110px}
.hint{text-align:center;font-size:13px;color:#9fb3d9;margin:4px 0 10px}
img{display:block;width:100%;height:auto;border-radius:10px;background:#fff}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(10,26,58,.96)}
.bar a{display:block;max-width:692px;margin:0 auto;text-align:center;background:#e5002d;color:#fff;text-decoration:none;font-weight:700;font-size:17px;padding:16px;border-radius:12px}
.box{position:relative}.hz{position:absolute;display:block;border-radius:8px;-webkit-tap-highlight-color:rgba(27,79,214,.25)}
.err{text-align:center;padding:60px 20px;color:#cfd8ea;line-height:1.7}
</style></head>
<body>
<div class="wrap">
 <p class="hint">👆 두 손가락으로 벌리면 크게 볼 수 있어요</p>
 <div id="box"></div>
</div>
<div class="bar"><a id="go" href="https://s1directmall.co.kr/" rel="noopener">🛒 에스원 다이렉트몰 바로가기</a></div>
<script>
/* 카톡으로 받은 안내 카드를 크게 보여주는 화면. 카카오에 올린 그림 주소만 보여줌 */
(function(){
  /* 상품 카드면 해당 상품 화면으로 연결 (다이렉트몰 주소만 허용) */
  try{var g=new URLSearchParams(location.search).get('go')||'',q=new URL(g);
    if(q.protocol==='https:'&&/^(m\.)?s1directmall\.co\.kr$/.test(q.hostname))document.getElementById('go').href=q.href;}catch(e){}
  var box=document.getElementById('box'),u='';
  try{u=new URLSearchParams(location.search).get('img')||'';}catch(e){}
  /* 카카오가 http 주소로 줄 때도 있어서 https로 바꿔서 불러옴 (카카오 그림 서버 주소만 허용) */
  var ok=false,why='';
  if(!u)why='no-img';
  else{try{var p=new URL(u);if(p.protocol==='http:')p.protocol='https:';ok=p.protocol==='https:'&&/(^|\.)(kakaocdn\.net|daumcdn\.net)$/.test(p.hostname);if(ok)u=p.href;else why=p.hostname;}catch(e){why='bad-url';}}
  if(!ok){box.innerHTML='<div class="err">카드를 불러올 수 없어요.<br>아래 버튼으로 다이렉트몰에 들어가 보세요.<br><small style="opacity:.5">('+why+')</small></div>';return;}
  var im=new Image();im.alt='에스원 다이렉트몰 안내 카드';im.src=u;
  im.onerror=function(){box.innerHTML='<div class="err">카드 보관 기간이 지났어요.<br>아래 버튼으로 다이렉트몰에 들어가 보세요.</div>';};
  box.appendChild(im);
  /* 칸마다 눌러서 해당 상품으로 (z=코드:x:y:w:h;… 비율) · 상품별 주소가 없으면 go(소모품 모아보기) */
  var ZU={};
  im.onload=function(){try{
    var z=new URLSearchParams(location.search).get('z')||'',go=document.getElementById('go').href;
    box.style.position='relative';
    z.split(';').forEach(function(t){var a=t.split(':');if(a.length<5)return;
      var h=document.createElement('a');h.className='hz';h.href=ZU[a[0]]||go;h.rel='noopener';
      h.style.left=(a[1]*100)+'%';h.style.top=(a[2]*100)+'%';h.style.width=(a[3]*100)+'%';h.style.height=(a[4]*100)+'%';box.appendChild(h);});
    /* 한 상품 카드는 카드 전체가 해당 상품 링크 */
    if(!z&&/^https:\/\/m\.s1directmall/.test(go)){var w=document.createElement('a');w.className='hz';w.href=go;w.style.cssText='left:0;top:0;width:100%;height:100%;';box.appendChild(w);}
  }catch(e){}};
})();
</script>
</body></html>

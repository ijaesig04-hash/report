.bgimg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 30%,transparent) 0%,color-mix(in srgb,var(--bg) 72%,transparent) 38%,color-mix(in srgb,var(--bg) 88%,transparent) 100%)}
.wrap{position:relative;z-index:1}
header.top{background:color-mix(in srgb,var(--panel) 84%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:14px;padding:12px 16px}
nav.steps{background:color-mix(in srgb,var(--panel) 80%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:14px;padding:6px}
.wrap{max-width:1280px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{display:flex;gap:12px;align-items:center}
.mark{width:38px;height:38px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:600 13px var(--f-mono);letter-spacing:.02em}
.brand h1{font-size:19px;margin:0;font-weight:700;text-wrap:balance}
.brand p{margin:0;color:var(--sub);font-size:12.5px}
.ctx{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--sub);font-size:12px;border:1px solid var(--line)}
.pill b{color:var(--ink);font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;align-items:start}
nav.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:4px}
.step{all:unset;cursor:pointer;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--r);color:var(--sub)}
.step .n{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 12px var(--f-mono);background:var(--panel)}
.step .t{font-weight:600;font-size:13.5px;color:var(--ink)}
.step .s{font-size:11.5px;color:var(--sub)}
.step:hover{background:var(--soft)}
.step:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.step.on{background:var(--panel);box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
.step.on .n{background:var(--c);border-color:var(--c);color:#fff}
.step .n{border-color:var(--c);color:var(--c)}
.step.on{box-shadow:inset 3px 0 0 var(--c),0 0 0 1px var(--line)}
.step.done .n::after{content:'';}
main{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--sc,var(--accent));border-radius:12px;padding:20px;margin-bottom:14px}
.card>h2:first-child{display:flex;align-items:center;gap:8px;color:var(--ink)}
.card>h2:first-child::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--sc,var(--accent));flex:none}
main[data-step="1"]{--sc:var(--s1);--st:var(--s1t)} main[data-step="2"]{--sc:var(--s2);--st:var(--s2t)} main[data-step="3"]{--sc:var(--s3);--st:var(--s3t)} main[data-step="4"]{--sc:var(--s4);--st:var(--s4t)} main[data-step="5"]{--sc:var(--s5);--st:var(--s5t)}
.card.memo{background:var(--st);border-color:transparent;border-top-color:var(--sc)}
.memo ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:13px}
.vsw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.vtag{display:inline-block;font:600 10.5px var(--f-mono);color:#fff;padding:1px 6px;border-radius:4px;margin-right:6px;min-width:34px;text-align:center}
.cal tr.vg-start td{border-top:2px solid var(--line)}
.cal td.nm{border-left:5px solid var(--vc,transparent)}

<script type="text/plain" id="wsrc">/* 근무 편성 엔진 (브라우저 Web Worker / Node 공용) — 담금질(Simulated Annealing) 탐색
   불변 원칙은 큰 벌점(HARD)으로, 4일 연속은 승인 벌점(APPR)으로, 나머지는 권장 벌점으로 계산 */
var ENGINE = (function () {
  var HARD = 10000, APPR = 2500;
  var HRS = { A: 10, B: 11, AJ: 11, G: 8, U: 8 };
  var REST = { D: 1, I: 1, J: 1, K: 1, P: 1, '/': 1 };
  var AFTER_B = { B: 1, D: 1, I: 1, J: 1 }; // 불변: 야간(B) 다음날은 B·D·I·J만

  function rng(seed) { var s = seed >>> 0 || 1; return function () { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }

  function build(inp) {
    var N = inp.N, P = inp.people.length, T = 7;
    var M = {
      N: N, P: P, T: T, hol: inp.hol, wd: inp.weekday, rules: inp.rules, people: inp.people, V: inp.vehicles,
      grid: [], free: [], seqLen: T + N, appr: {}
    };
    (inp.approved || []).forEach(function (a) { M.appr[a.p + '|' + a.kind + '|' + a.start] = 1; });
    var vIdx = {}; M.V.forEach(function (v, i) { vIdx[v.no] = i; });
    M.vIdx = vIdx;
    M.pv = inp.people.map(function (p) { return vIdx[p.veh]; });
    M.keepIdx = inp.people.map(function (p) { return (p.keep || []).map(function (k) { return vIdx[k]; }).filter(function (x) { return x !== undefined; }); });
    M.mustRun = M.V.map(function (v) { return !v.dropOk; });
    var availCnt = 0, hols = 0;
    for (var d = 0; d < N; d++) if (M.hol[d]) hols++;
    M.avail = [];
    for (var p = 0; p < P; p++) {
      var pp = inp.people[p], row = [], fr = [], av = 0;
      for (var t = 0; t < T; t++) row.push(pp.tail && pp.tail[t] ? pp.tail[t] : '?');
      for (d = 0; d < N; d++) {
        var f = pp.fixed[d];
        if (f) { row.push(f); fr.push(0); if (f === 'A' || f === 'B' || f === 'D') av++; }
        else { row.push('D'); fr.push(1); av++; }
      }
      M.grid.push(row); M.free.push(fr); M.avail.push(av); availCnt += av;
    }
    // 기대 근무일(형평)
    var r = M.rules, exp = 0;
    for (d = 0; d < N; d++) exp += r.dayAmin + (M.hol[d] ? r.holNight : r.wkNight);
    M.tgt = M.avail.map(function (a) { return Math.round(exp * a / availCnt); });
    M.htgt = M.avail.map(function (a) { return Math.round(hols * (r.dayAmin + r.holNight) / P * a / N); });
    // 주(월~일) 경계: seq index 기준 각 주의 시작/끝
    var weeks = [], first = T - inp.firstDow; // firstDow: 1일의 요일 (월=0)
    for (var s = first; s < T + N; s += 7) weeks.push([Math.max(0, s), s + 6]);
    M.weeks = weeks;
    M.eqIdx = []; for (p = 0; p < P; p++) if (!inp.people[p].fixedPattern && M.avail[p] === N) M.eqIdx.push(p);
    return M;
  }

  function initPattern(M, R) {
    var pat = ['A', 'A', 'B', 'B', 'D', 'D'];
    for (var p = 0; p < M.P; p++) {
      var off = Math.floor(R() * 6);
      for (var d = 0; d < M.N; d++) if (M.free[p][d]) M.grid[p][M.T + d] = pat[(d + off) % 6];
    }
  }

  function isWork(c) { return c === 'A' || c === 'B' || c === 'AJ' || c === 'G' || c === 'U'; }

  // ---------- 개인 비용 ----------
  function personCost(M, p, out) {
    var s = M.grid[p], L = M.seqLen, T = M.T, r = M.rules, pp = M.people[p], c = 0, h = 0, k, i;
    var fixedAt = function (i) { return i < T || !M.free[p][i - T]; };
    // B 다음날은 B·D·I·J만 (A·G·U·AJ·P 등 불가)
    for (i = T; i < L; i++) if (s[i - 1] === 'B' && s[i] !== '?' && !AFTER_B[s[i]]) { c += HARD; if (out) out.push({ p: p, rule: 'B 다음날 ' + s[i], lv: 'hard', d: i - T }); }
    // 연속 런
    i = 0;
    while (i < L) {
      var ch = s[i], j = i;
      while (j + 1 < L && s[j + 1] === ch) j++;
      var len = j - i + 1;
      if (j >= T) {
        if (ch === 'A' || ch === 'B') {
          var mx = ch === 'A' ? r.aMax : r.bMax, ex = len - mx;
          if (ex === 1) {
            var key = p + '|' + ch + '|' + (i - T);
            if (M.appr[key]) c += 300; else { c += APPR; if (out) out.push({ p: p, rule: (ch === 'B' ? '야간' : '주간') + ' ' + len + '일 연속', lv: 'appr', d: i - T, kind: ch, len: len }); }
          } else if (ex >= 2) { c += HARD * ex; if (out) out.push({ p: p, rule: (ch === 'B' ? '야간' : '주간') + ' ' + len + '일 연속', lv: 'hard', d: i - T }); }
          if (len >= 3) c += (pp.junior ? 20 : 3) * (len - 2);
        } else if (ch === 'D' && len > r.dMax) {
          var allFixed = true; for (k = i; k <= j; k++) if (!fixedAt(k)) allFixed = false;
          if (!allFixed) { c += HARD * (len - r.dMax); if (out) out.push({ p: p, rule: '휴무 ' + len + '일 연속', lv: 'hard', d: i - T }); }
        }
      }
      i = j + 1;
    }
    // 주 시간
    for (k = 0; k < M.weeks.length; k++) {
      var w = M.weeks[k], wh = 0;
      for (i = w[0]; i <= w[1] && i < L; i++) wh += HRS[s[i]] || 0;
      if (wh > r.weekMax) { c += HARD * (wh - r.weekMax); if (out) out.push({ p: p, rule: '주 ' + wh + '시간', lv: 'hard', d: Math.max(0, w[0] - T) }); }
    }
    // 패턴 권장
    var wdays = 0, na = 0, nb = 0, hw = 0;
    for (i = T; i < L; i++) {
      var x = s[i], pr = s[i - 1], nx = i + 1 < L ? s[i + 1] : null, fr = M.free[p][i - T];
      if (x === 'A') { na++; h += 10; } else if (x === 'B') { nb++; h += 11; } else h += HRS[x] || 0;
      if (x === 'A' || x === 'B') { wdays++; if (M.hol[i - T]) hw++; }
      if (nx === null) continue;
      if (x === 'D' && !REST[pr] && !REST[nx] && !(pr === 'A' && nx === 'B') && fr && (i + 1 - T >= M.N || M.free[p][i + 1 - T]) && (i - 1 < T || M.free[p][i - 1 - T])) c += 6;
      if (x === 'B' && pr !== 'B' && nx !== 'B') c += 4;
      if (x === 'B' && pr === 'D') c += 3;
      if (x === 'D' && pr === 'A') c += 4;
      if (x === 'A' && pr !== 'A' && nx !== 'A') c += 2;
    }
    // 정식 휴무 간격 (12일 권장 / 15일 강하게)
    var pair = [];
    for (i = 0; i < L - 1; i++) pair.push((REST[s[i]] && REST[s[i + 1]]) || (i > 0 && s[i - 1] === 'A' && s[i] === 'D' && s[i + 1] === 'B') ? 1 : 0);
    var gaps = [[11, r.rest12w], [14, r.rest15w]];
    for (k = 0; k < 2; k++) {
      var span = gaps[k][0], wt = gaps[k][1], run = 0;
      for (i = 0; i < pair.length; i++) {
        run = pair[i] ? 0 : run + 1;
        if (run >= span && i + 1 > T) c += wt;
      }
    }
    // 연속 7일
    for (i = 1; i + 6 < L; i++) {
      if (i + 6 < T) continue;
      var cnt = 0, hh = 0;
      for (k = i; k < i + 7; k++) { if (isWork(s[k])) cnt++; hh += HRS[s[k]] || 0; }
      if (cnt >= 7) c += 60;
      if (hh > 64) c += 10 * (hh - 64);
    }
    // 형평
    if (!pp.fixedPattern) {
      var dv = Math.abs(wdays - M.tgt[p]) - 1; if (dv > 0) c += 15 * dv;
      var dh = Math.abs(hw - M.htgt[p]) - 1; if (dh > 0) c += 6 * dh;
      var db = Math.abs(na - nb) - 3; if (db > 0) c += 3 * db;
    }
    if (pp.junior) c += 5 * hw;
    // 분기 상한: 전월까지 분기 누적 + 이번 달 ≤ 분기 상한 (qLeft = 상한 - 누적)
    if (pp.qLeft != null && h > pp.qLeft) { c += HARD * Math.ceil(h - pp.qLeft); if (out) out.push({ p: p, rule: '분기 상한 ' + Math.round((h - pp.qLeft) * 10) / 10 + 'h 초과', lv: 'hard', d: M.N - 1 }); }
    else if (pp.qLeft != null && h > pp.qLeft - 4) c += 20 * Math.ceil(h - (pp.qLeft - 4));
    return { c: c, h: h };
  }

  // ---------- 일자 비용 ----------
  function dayCost(M, d, out) {
    var r = M.rules, i = M.T + d, a = 0, b = 0, c = 0, V = M.V.length;
    var req = M.mustRun.slice(), nbV = {}, naV = {};
    for (var p = 0; p < M.P; p++) {
      var x = M.grid[p][i];
      if (x === 'A') { a++; if (M.people[p].newbie) naV[M.pv[p]] = (naV[M.pv[p]] || 0) + 1; }
      else if (x === 'B') {
        b++;
        if (M.people[p].newbie) {

function ymLabel(k){k=String(k);return k.slice(0,4)+'년 '+(+k.slice(4))+'월';}

// ================= 공휴일 =================
var LUNAR={2025:{seol:[1,29],chuseok:[10,6],buddha:[5,5]},2026:{seol:[2,17],chuseok:[9,25],buddha:[5,24]},2027:{seol:[2,7],chuseok:[9,15],buddha:[5,13]},2028:{seol:[1,27],chuseok:[10,3],buddha:[5,2]}};
function krHolidays(y){ // returns map 'm-d' -> name
  var H={};function add(m,d,n){var dt=new Date(y,m-1,d);var k=(dt.getMonth()+1)+'-'+dt.getDate();H[k]=H[k]?H[k]+'·'+n:n;return dt;}
  function isHol(dt){return !!H[(dt.getMonth()+1)+'-'+dt.getDate()];}
  function wk(dt){var w=dt.getDay();return w===0||w===6;}
  function nextFree(dt){var x=new Date(dt);do{x.setDate(x.getDate()+1);}while(wk(x)||isHol(x));return x;}
  add(1,1,'신정');add(5,1,'근로자의날');add(6,6,'현충일');
  var subs=[[3,1,'삼일절'],[5,5,'어린이날'],[8,15,'광복절'],[10,3,'개천절'],[10,9,'한글날'],[12,25,'성탄절']];
  var L=LUNAR[y];var three=[];
  if(L){[['seol','설날'],['chuseok','추석']].forEach(function(z){var c=new Date(y,L[z[0]][0]-1,L[z[0]][1]);var ds=[-1,0,1].map(function(o){var x=new Date(c);x.setDate(x.getDate()+o);return x;});
    var overlap=ds.some(function(x){return x.getDay()===0||isHol(x)||subs.some(function(s){return s[0]===x.getMonth()+1&&s[1]===x.getDate();});});
    ds.forEach(function(x){add(x.getMonth()+1,x.getDate(),z[1]);});three.push([ds[2],overlap,z[1]]);});
    subs.push([L.buddha[0],L.buddha[1],'부처님오신날']);}
  subs.forEach(function(s){var dt=new Date(y,s[0]-1,s[1]);var clash=isHol(dt);add(s[0],s[1],s[2]);if(wk(dt)||clash){var t=nextFree(dt);add(t.getMonth()+1,t.getDate(),'대체공휴일');}});
  three.forEach(function(t){if(t[1]){var x=nextFree(t[0]);add(x.getMonth()+1,x.getDate(),'대체공휴일');}});
  return {map:H,known:!!L};
}
function defaultHolidays(y,m){var N=dim(y,m),h=krHolidays(y),out=[];for(var d=1;d<=N;d++){var w=dowIdx(y,m,d);if(w>=5||h.map[m+'-'+d])out.push(d);}return out;}
function holName(y,m,d){var h=krHolidays(y).map[m+'-'+d];return h||'';}

// ================= 일정방 특이사항 해석 =================
function matchPerson(tok,names){tok=tok.replace(/(프로|님|씨)$/,'');var ex=names.filter(function(n){return n===tok;});if(ex.length)return ex;
  var a=names.filter(function(n){return n.slice(-tok.length)===tok;});if(a.length)return a;return names.filter(function(n){return n.indexOf(tok)>=0;});}
// 일정방 글 해석: 날짜 뒤 코드(25일A·21(주간))는 그 날짜, 괄호 안 날짜+말(15~17은 교육G)은 그 날짜, 괄호 안에 남는 말(9일주간 예비군)은 괄호 앞 날짜, 나머지는 휴무 D. 다음 달 날짜(1월3일)는 빼고 알림
function parseReq(text,names,N,holSet,mon){
  var req={},notes=[],CODEW=[['결혼|웨딩|신혼|경조','WED'],['예비군|민방위','P'],['교육|출장|선발대회|연수','G'],['공가','K'],['연차|휴가|리프레쉬','I'],['주간','A'],['야간','B'],['휴무|비번|휴','D']];
  var LET={A:'A',B:'B',D:'D',I:'I',G:'G',P:'P',J:'WED',K:'K',U:'U'};
  var allP=(typeof S!=='undefined'&&S.br)?S.br.people:[];
  function lex(body){var t=[],i=0,s=body;
    var re=/(\d{1,2})\s*월\s*(\d{1,2})\s*일?|(\d{1,2})\s*일?|[~～–]|[()（）]|[A-Za-z]|[가-힣]+|./g,x;
    while((x=re.exec(s))){var w=x[0];
      if(x[1]!==undefined){var mm=+x[1],dd=+x[2];t.push(mm===mon?{k:'n',v:dd}:{k:'f',v:dd,m:mm});continue;}
      if(x[3]!==undefined){t.push({k:'n',v:+x[3]});continue;}
      if(/^[~～–]$/.test(w)){t.push({k:'~'});continue;}
      if(w==='('||w==='（'){t.push({k:'('});continue;}
      if(w===')'||w==='）'){t.push({k:')'});continue;}
      if(/^[A-Za-z]$/.test(w)){var L=LET[w.toUpperCase()];if(L)t.push({k:'c',v:L});continue;}
      if(/^[가-힣]+$/.test(w)){for(var j=0;j<CODEW.length;j++){if(new RegExp(CODEW[j][0]).test(w)){t.push({k:'c',v:CODEW[j][1]});break;}}if(/없음|없어|x$/i.test(w))t.push({k:'none'});continue;}
      if(w==='-'){var pr=t[t.length-1];if(pr&&(pr.k==='n'||pr.k==='f'))t.push({k:'~'});continue;}
    }
    return t;}
  text.split(/\n+/).forEach(function(raw){
    var line=raw.trim();if(!line)return;
    var m=line.match(/^([가-힣A-Za-z]{2,5})(?:\s*(?:프로|님|씨))?\s*[-:：]\s*(.*)$/)||line.match(/^([가-힣]{2,4})\s+(\d.*)$/);
    if(!m){notes.push({lv:'warn',t:'형식을 못 읽음: '+line});return;}
    var who=matchPerson(m[1],names);
    if(who.length!==1){var out=allP.filter(function(p){return p.outFrom&&names.indexOf(p.name)<0;}).map(function(p){return p.name;});var wo=matchPerson(m[1],out);
      if(wo.length===1)notes.push({lv:'warn',t:wo[0]+'은(는) 이번 달 명단에서 빠져 있어 요청을 건너뛰었어요: '+m[2]});
      else notes.push({lv:'warn',t:(who.length?'이름이 여러 명과 겹침':'명단에 없는 이름')+': '+m[1]+' → 직접 입력해 주세요'});return;}
    var name=who[0],put={},next=[];
    var T=lex(m[2]);if(!T.some(function(x){return x.k==='n'||x.k==='f';}))return;
    // 날짜 묶음 만들기: 범위 a~b (끝이 다음 달이면 말일까지)
    var items=[];for(var i=0;i<T.length;i++){var x=T[i];
      if((x.k==='n'||x.k==='f')&&T[i+1]&&T[i+1].k==='~'&&T[i+2]&&(T[i+2].k==='n'||T[i+2].k==='f')){var a=x,b=T[i+2];var ds=[];
        if(a.k==='f'){next.push(a.m+'월 '+a.v+'일~'+(b.k==='f'?b.m+'월 ':'')+b.v+'일');}
        else if(b.k==='f'){for(var d=a.v;d<=N;d++)ds.push(d);next.push(b.m+'월 1~'+b.v+'일');}
        else for(var d2=a.v;d2<=b.v;d2++)ds.push(d2);
        items.push({k:'d',v:ds});i+=2;continue;}
      if(x.k==='n'){items.push({k:'d',v:[x.v]});continue;}
      if(x.k==='f'){next.push(x.m+'월 '+x.v+'일'+(T[i+1]&&T[i+1].k==='('&&T[i+2]&&T[i+2].k==='c'?'('+({WED:'경조'}[T[i+2].v]||T[i+2].v)+')':''));items.push({k:'skip'});continue;}
      if(x.k==='~')continue;items.push(x);}
    // 해석: 날짜 뒤 코드 = 그 날짜들, 괄호 안 남는 말 = 괄호 앞 날짜들, 줄 전체 남는 말 = 기본값
    var lineKind=null,assigned={};
    function give(ds,c){ds.forEach(function(d){if(!(d in assigned))assigned[d]=c;});}
    function walk(j0,depth){var grp=[],lastItem=[],last=null,left=null,hasD=false,j=j0;
      for(;j<items.length;j++){var it=items[j];
        if(it.k==='d'){grp=grp.concat(it.v);lastItem=it.v;last=null;hasD=true;continue;}
        if(it.k==='skip'){grp=[];lastItem=[];last='skip';continue;}
        if(it.k==='c'){if(grp.length){give(grp,it.v);grp=[];lastItem=[];last=it.v;}else if(last==='skip'){}else if(last!==it.v){if(left===null)left=it.v;last=it.v;}continue;}
        if(it.k==='('){var r=walk(j+1,depth+1);j=r.j;
          if(r.left){if(r.hasD){give(grp,r.left);grp=[];}else{give(lastItem,r.left);grp=grp.filter(function(d){return lastItem.indexOf(d)<0;});}lastItem=[];last=r.left;}
          else if(r.hasD)lastItem=[];
          continue;}
        if(it.k===')'&&depth>0)return {j:j,left:left,hasD:hasD};
      }
      if(depth===0)lineKind=left;return {j:j,left:left,hasD:hasD};}
    walk(0,0);
    var all=[];items.forEach(function(it){if(it.k==='d')all=all.concat(it.v);});
    var dflt=lineKind||'D';
    var un=all.filter(function(d){return !(d in assigned);}).sort(function(a,b){return a-b;});
    var wedCnt=0;
    function setc(d,c){if(d<1||d>N){notes.push({lv:'warn',t:name+': '+d+'일은 이 달에 없음'});return;}
      if(c==='WED'){if(wedCnt<5){c='J';wedCnt++;}else c=holSet[d]?'D':'I';}put[d]=c;}
    Object.keys(assigned).map(Number).sort(function(a,b){return a-b;}).forEach(function(d){setc(d,assigned[d]);});
    un.forEach(function(d){setc(d,dflt);});
    req[name]=Object.assign(req[name]||{},put);
    var ks=Object.keys(put).map(Number).sort(function(a,b){return a-b;});
    if(ks.length)notes.push({lv:'ok',t:name+': '+ks.map(function(d){return d+'일 '+put[d];}).join(', ')});
    if(next.length)notes.push({lv:'warn',t:name+': 다음 달 요청('+next.join(', ')+')은 다음 달 특이사항에 다시 넣어 주세요'});
  });
  return {req:req,notes:notes};
}
// 휴무 D 붙여서 최대 dMax일 → 그 다음은 연차 I (전월 말 D 포함)
// 고정 패턴(patAt)의 D도 같이 셈: 예) 김태건 목금 D(패턴) + 토일 휴무 요청 → 목금 D, 토일 I
function normalizeD(reqP,tail,N,dMax,patAt){var run=0,changed=[];for(var i=tail.length-1;i>=0;i--){if(tail[i]==='D')run++;else break;}
  for(var d=1;d<=N;d++){var c=reqP[d]||(patAt?patAt(d):null);if(c==='D'){run++;if(run>dMax){reqP[d]='I';changed.push(d);}}else run=0;}return changed;}
function normalizeAllD(br,M){var N=dim(M.y,M.m),dM=rulesOf(br).dMax,conv=[];
  activePeople(br).forEach(function(p){var n=p.name,pat=p.fixedPattern?function(d){return p.fixedPattern[dowIdx(M.y,M.m,d)];}:null;
    if(!M.req[n]&&!pat)return;var q=M.req[n]||{};var ch=normalizeD(q,(M.tail||{})[n]||[],N,dM,pat);
    if(ch.length){M.req[n]=q;conv.push(n+' '+ch.join(',')+'일');}});return conv;}

// ================= 차량 배정 =================
function assignVehicles(br,sched,N){
  var fp=fieldPeople(br),V=br.vehicles.map(function(v){return v.no;}),r=rulesOf(br);
  var rankW={top:0,mid:1,last:2},cross={},drops={},va={},nightOff=[];
  fp.forEach(function(p){cross[p.name]=0;va[p.name]=new Array(N).fill('');});
  V.forEach(function(v){drops[v]=0;});
  for(var d=0;d<N;d++){
    // 주간
    var A=fp.filter(function(p){return sched[p.name][d]==='A';});
    var cnt={};V.forEach(function(v){cnt[v]=[];});
    A.slice().sort(function(a,b){return (b.newbie?1:0)-(a.newbie?1:0)||rankW[a.rank||'mid']-rankW[b.rank||'mid'];}).forEach(function(p){cnt[p.veh]?cnt[p.veh].push(p):null;});
    var guard=0;
    while(guard++<40){var empty=V.filter(function(v){return cnt[v].length===0;});var over=V.filter(function(v){return cnt[v].length>(empty.length?1:2);});
      if(!empty.length&&!over.length)break;
      var movers=[];over.forEach(function(v){cnt[v].forEach(function(p,i){if(i>0&&!p.newbie)movers.push([v,p]);});});
      if(!movers.length)break;
      movers.sort(function(a,b){return rankW[b[1].rank||'mid']-rankW[a[1].rank||'mid']||cross[a[1].name]-cross[b[1].name];});
      var mv=movers[0];var tgt=empty.length?empty[0]:V.slice().sort(function(a,b){return cnt[a].length-cnt[b].length;})[0];
      cnt[mv[0]].splice(cnt[mv[0]].indexOf(mv[1]),1);cnt[tgt].push(mv[1]);}
    V.forEach(function(v){cnt[v].forEach(function(p){va[p.name][d]=v;if(v!==p.veh)cross[p.name]++;});});
    // 야간
    var B=fp.filter(function(p){return sched[p.name][d]==='B';});
    var req={};br.vehicles.forEach(function(v){if(!v.dropOk)req[v.no]=1;});
    B.forEach(function(p){if(p.newbie){req[p.veh]=1;(p.keep||[]).forEach(function(k){req[k]=1;});}});
    var run=Object.keys(req);
    var rest=V.filter(function(v){return !req[v];}).sort(function(a,b){
      var oa=B.some(function(p){return p.veh===a;})?0:1,ob=B.some(function(p){return p.veh===b;})?0:1;return oa-ob||drops[b]-drops[a];});
    while(run.length<Math.min(B.length,V.length)&&rest.length)run.push(rest.shift());
    var cover={};var left=[];
    B.slice().sort(function(a,b){return (b.newbie?1:0)-(a.newbie?1:0)||rankW[a.rank||'mid']-rankW[b.rank||'mid'];}).forEach(function(p){
      if(run.indexOf(p.veh)>=0&&!cover[p.veh]){cover[p.veh]=p;}else left.push(p);});
    left.sort(function(a,b){return cross[a.name]-cross[b.name];});
    run.forEach(function(v){if(!cover[v]&&left.length){var i=left.findIndex(function(p){return !p.newbie;});if(i<0)i=0;cover[v]=left.splice(i,1)[0];}});
    Object.keys(cover).forEach(function(v){var p=cover[v];va[p.name][d]=v;if(v!==p.veh)cross[p.name]++;});
    var off=V.filter(function(v){return !cover[v];});off.forEach(function(v){drops[v]++;});nightOff.push(off.join(' '));
  }
  return {va:va,nightOff:nightOff,cross:cross,drops:drops};
}

// ================= 파트장·동승 =================
function leaderRows(br,y,m,N,hol,req){
  var L=br.leaders||[],out={};if(!L.length)return out;
  var first=br.leaderAFirst&&L.some(function(l){return l.name===br.leaderAFirst;})?br.leaderAFirst:L[0].name;
  var order=[first].concat(L.map(function(l){return l.name;}).filter(function(n){return n!==first;}));
  var start=dowIdx(y,m,1);
  L.forEach(function(l){var row=[];for(var d=1;d<=N;d++){var rq=(req[l.name]||{})[d];if(rq){row.push(rq);continue;}if(hol[d-1]){row.push('D');continue;}
    var wi=d<=15?0:1;row.push(order.length>1?(order[wi%order.length]===l.name?'A':'AJ'):'AJ');}out[l.name]=row;});
  for(var d=0;d<N;d++){if(hol[d])continue;var pres=L.filter(function(l){return out[l.name][d]==='A'||out[l.name][d]==='AJ';});if(pres.length&&!pres.some(function(l){return out[l.name][d]==='AJ';}))out[pres[0].name][d]='AJ';}
  return out;
}

// ================= 독립 점검 =================
function verify(br,month,res){
  var N=dim(month.y,month.m),hol=holArr(month),r=rulesOf(br),fp=fieldPeople(br),iss=[],ppl=[],QI=quarterInfo(month.y,month.m,r),QU=month.qUsed||{};
  var tails=month.tail||{},appr={};(month.approved||[]).forEach(function(a){appr[a.name+'|'+a.kind+'|'+a.start]=1;});
  var all=fp.map(function(p){return {name:p.name,field:true,p:p};}).concat((br.leaders||[]).map(function(l){return {name:l.name,field:false};}));
  var start=dowIdx(month.y,month.m,1);
  all.forEach(function(o){
    var row=res.sched[o.name];if(!row)return;var tail=(tails[o.name]||[]).slice(-7);var seq=tail.concat(row),T=tail.length;
    for(var i=Math.max(1,T);i<seq.length;i++)if(badAfterB(seq[i-1],seq[i]))iss.push({lv:'hard',name:o.name,d:i-T+1,t:'야간 다음날 '+seq[i]+' (B 다음날은 B·D·I·J만)'});
    var i0=0;while(i0<seq.length){var c=seq[i0],j=i0;while(j+1<seq.length&&seq[j+1]===c)j++;var len=j-i0+1;
      if(j>=T){var sd=i0-T+1,lbl=sd>=1?sd+'일':'전월 말';
        if(c==='B'||(c==='A'&&o.field)){var mx=c==='B'?r.bMax:r.aMax;if(len>=mx+2)iss.push({lv:'hard',name:o.name,d:Math.max(1,sd),t:(c==='B'?'야간':'주간')+' '+len+'일 연속 ('+lbl+'부터)'});
          else if(len===mx+1&&!appr[o.name+'|'+c+'|'+(i0-T)])iss.push({lv:'appr',name:o.name,d:Math.max(1,sd),kind:c,start:i0-T,t:(c==='B'?'야간':'주간')+' '+len+'일 연속 ('+lbl+'부터) — 승인 필요'});
          else if(len===mx+1)iss.push({lv:'info',name:o.name,d:Math.max(1,sd),t:(c==='B'?'야간':'주간')+' '+len+'일 연속 (승인됨)'});}
        if(c==='D'&&o.field&&len>r.dMax)iss.push({lv:'hard',name:o.name,d:Math.max(1,sd),t:'휴무 '+len+'일 연속 ('+lbl+'부터) — '+(r.dMax+1)+'일째부터 연차(I)로'});}
      i0=j+1;}
    var wmax=0,wl=[];for(var ws=T-start;ws<seq.length;ws+=7){var h=0;for(var k2=Math.max(0,ws);k2<ws+7&&k2<seq.length;k2++)h+=HRS[seq[k2]]||0;wmax=Math.max(wmax,h);
      wl.push(h);if(h>r.weekMax)iss.push({lv:'hard',name:o.name,d:Math.max(1,ws-T+1),t:'주(월~일) '+h+'시간 — 상한 '+r.weekMax+'h'});}
    var hrs=row.reduce(function(s,c){return s+(HRS[c]||0);},0);
    var qu=QU[o.name],qt=null,ql=null;if(qu!=null&&qu!==''){qt=r1(+qu+hrs);ql=r1(QI.cap-qt);
      if(ql<0)iss.push({lv:'hard',name:o.name,d:0,t:QI.q+'분기 '+qt+'h — 상한 '+QI.cap+'h보다 '+r1(-ql)+'h 많아요'});
      else if(ql<8)iss.push({lv:'info',name:o.name,d:0,t:QI.q+'분기 '+qt+'h — 상한까지 '+ql+'h (잔업 주의)'});}
    ppl.push({name:o.name,field:o.field,hours:hrs,wmax:wmax,wl:wl,qt:qt,ql:ql,A:row.filter(function(c){return c==='A';}).length,B:row.filter(function(c){return c==='B';}).length,
      hw:row.filter(function(c,i){return hol[i]&&(c==='A'||c==='B'||c==='AJ');}).length,leave:row.filter(function(c){return !(c in {A:1,B:1,D:1,AJ:1});}).length});
  });
  var daily=[],full=0;
  for(var d=0;d<N;d++){var a=0,b=0;fp.forEach(function(p){var c=res.sched[p.name][d];if(c==='A')a++;if(c==='B')b++;});
    var tB=hol[d]?r.holNight:r.wkNight;var off=(res.nightOff&&res.nightOff[d]?res.nightOff[d].split(' ').filter(Boolean):[]);
    var running=br.vehicles.length-off.length;

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#14275C">
<title>AI 응대 연습 · 북서울 Report</title>
<style>
:root{--navy:#14275C;--red:#E4002B;--ink:#16203a;--mute:#5d6879;--line:#dde3ee;--bg:#f2f4f9;--ok:#1d7a4c;--warn:#b4620a}
*{box-sizing:border-box}
/* 길게 눌러도 글자 선택·검색 창이 뜨지 않게 (입력칸만 예외) */
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img,a{-webkit-touch-callout:none;-webkit-user-drag:none}
html,body{word-break:keep-all;overflow-wrap:anywhere;margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:max(12px,env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;gap:10px}
.top b{font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .me{flex:none;font-size:13px;opacity:.85}
.back{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;width:40px;height:36px;font-size:20px}
.me{font-size:12px;opacity:.85}
main{max-width:560px;margin:0 auto;padding:14px 14px 90px}
.demo{background:#fff4dc;border:1px solid #f0d49a;color:#7a4b00;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:2px 0 4px}
.sub{color:var(--mute);font-size:13px;margin:0 0 10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 4px}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 0;font-weight:700;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.sc{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.sc:active{background:#f3f6fd}
.sc i{font-style:normal;font-size:30px}
.sc b{display:block;font-size:16px}.sc span{font-size:13px;color:var(--mute)}
.tag{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:8px;padding:1px 8px;margin-left:6px;vertical-align:1px}
.sc .tag{color:#fff;font-size:11px;font-style:normal;margin:0 6px 0 0}.tag.상{background:var(--red)}.tag.중{background:#e08a00}.tag.하{background:#2b8a5a}
.last{font-size:12px;color:var(--mute);margin-top:2px}
/* 대화 */
.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.pill{background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700}
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
.b{max-width:86%;padding:11px 14px;border-radius:18px;font-size:16px;line-height:1.55;word-break:keep-all}
.b.c{background:#fff;border:1px solid var(--line);border-top-left-radius:6px;align-self:flex-start}
.b.c::before{content:'👤 고객';display:block;font-size:11px;font-weight:700;color:var(--red);margin-bottom:2px}
.b.s{background:var(--navy);color:#fff;border-top-right-radius:6px;align-self:flex-end}
.tip{align-self:center;background:#fff4dc;border:1px solid #f0d49a;color:#7a4b00;font-size:13px;border-radius:12px;padding:6px 12px}
.typing{align-self:flex-start;color:var(--mute);font-size:13px}
.dock{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px max(10px,env(safe-area-inset-bottom))}
.dock .in{max-width:560px;margin:0 auto}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;font-size:16px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--navy);color:#fff}
.btn.red{background:var(--red)}.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.block{display:block;width:100%;margin-top:8px}
.mic{width:100%;margin-bottom:8px;padding:16px;font-size:17px;border-radius:14px;border:0;background:var(--red);color:#fff;font-weight:700}
.mic.on{background:#8a0019;animation:pl 1s infinite}
@keyframes pl{50%{opacity:.7}}
@media(prefers-reduced-motion:reduce){.mic.on{animation:none}}
.warn{font-size:12px;color:var(--mute);text-align:center;margin-top:6px}
/* 평가 */
.big{font-size:54px;font-weight:900;color:var(--navy);line-height:1}
.big small{font-size:20px;color:var(--mute);font-weight:700}
.pr{border:1px solid var(--line,#e3e8f0);border-radius:14px;overflow:hidden;margin-top:8px}.pr div{padding:9px 12px;font-size:14px;line-height:1.55}.pr em{display:block;font-style:normal;font-size:11.5px;font-weight:700;margin-bottom:2px}
.pr-me{background:#f6f7fa;color:#475569}.pr-me em{color:#94a3b8}.pr-ok{background:#ecf8f1;color:#14532d}.pr-ok em{color:#16a34a}
.wk h2 small{font-size:12px;font-weight:600;color:var(--mute);margin-left:4px}.wk-t{font-style:normal;font-size:11px;font-weight:700;color:#fff;background:var(--red);border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:1px}
.wk-h{margin:12px 0 6px;font-size:13.5px}.wk-go{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#f4f7ff;border:0;border-radius:12px;padding:10px 12px;margin-top:6px;font:inherit;color:inherit;cursor:pointer}.wk-go span{font-size:20px}.wk-go b{flex:1;font-size:14.5px}.wk-go i{font-style:normal;color:var(--mute);font-size:18px}
.delta{display:inline-block;margin:10px 0 4px;font-size:14px;font-weight:700;border-radius:999px;padding:5px 12px;line-height:1.3}.delta.up{color:#11683f;background:#e3f5ea}.delta.dn{color:#b4151f;background:#fde8ea}.delta.eq{color:#475569;background:#eef1f6}
.it{margin:10px 0}.it div{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.it u{display:block;height:9px;border-radius:5px;background:#e8ecf5;margin-top:4px;text-decoration:none;overflow:hidden}
.it u i{display:block;height:100%;background:var(--navy);border-radius:5px}
.it.lo u i{background:var(--red)}
ul.l{margin:6px 0 0;padding-left:20px}ul.l li{margin:5px 0}
.ex{background:#eef3ff;border-radius:12px;padding:10px 12px;margin-top:8px;font-size:15px}
/* 현황 */
.k3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.k3 div{background:#f3f6fd;border-radius:12px;padding:10px 6px;text-align:center}
.k3 span{display:block;font-size:11px;color:var(--mute)}.k3 b{font-size:22px;color:var(--navy)}
.chip{display:inline-block;background:#fdecef;color:#a30020;border-radius:14px;padding:2px 10px;margin:3px 4px 0 0;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--mute)}
.hidden{display:none!important}
.gh{margin:16px 2px 8px;font-size:14px;font-weight:800;color:var(--navy)}
.keys{background:#eef3ff;border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:13.5px}.keys summary{font-weight:700;cursor:pointer}.keys ol{margin:6px 0 2px;padding-left:20px}.keys li{margin:3px 0}
.hero{border-radius:16px;overflow:hidden;margin-bottom:12px;box-shadow:0 6px 18px rgba(20,39,92,.18);background:#fff}
.hero img{display:block;width:100%;height:auto;aspect-ratio:1672/941;object-fit:cover}
</style>
</head>

 {"id": "false-alarm", "g": "불만", "ic": "🌙", "title": "오경보로 새벽에 깬 고객", "lv": "상", "persona": "새벽 3시에 경보가 울려 출동 요원이 다녀갔는데 오경보였다. 아이가 놀라 깼고 이번이 세 번째라 몹시 화가 나 있다. 매번 '죄송하다'는 말만 들었다고 느낀다. 감지기 오작동 원인, 재발 방지를 위한 점검 일정, 성의 있는 사과를 원한다. 형식적인 사과만 반복하면 '해지하겠다'는 말까지 꺼낸다. 구체적인 점검 약속(언제, 누가)을 들으면 누그러진다.", "open": "지금이 새벽 3시예요. 또 오경보라니, 이번이 벌써 세 번째라고요! 애까지 놀라서 깼는데 대체 어떻게 된 거예요?", "demo": ["세 번째인데 매번 사과만 하시면 끝인가요? 원인이 뭐예요?", "그럼 앞으로 안 울린다는 보장은 있어요?", "언제 와서 점검해 주시는데요? 또 기다리라고 하시는 건 아니죠?"], "key": ["놀라고 잠 깬 불편부터 공감하고 사과하기", "오경보 원인(감지기·환경)을 확인해 쉬운 말로 설명하기", "점검 날짜·시간을 구체적으로 약속하기"]},
 {"id": "cancel", "g": "불만", "ic": "✋", "title": "해지하겠다는 고객", "lv": "상", "persona": "월 이용료 부담과 이사 계획을 이유로 해지를 요구한다. 속으로는 출동이 늦었던 일과 문의 때 응대가 성의 없었던 일이 쌓여 있다. 해지를 막으려는 형식적인 설득이나 위약금 얘기부터 꺼내면 반발한다. 불만을 먼저 들어주고, 이전 설치나 서비스 구성 조정 같은 현실적인 대안을 제시하면 마음이 흔들린다.", "open": "저 이번 달까지만 쓰고 해지할 거예요. 요금도 부담되고, 솔직히 별로 도움이 된다는 생각도 안 들어서요.", "demo": ["다른 데는 더 싸던데, 굳이 계속 써야 할 이유가 뭐예요?", "이사 가면 어차피 못 쓰잖아요. 그건 어떻게 되는데요?", "일단 알겠는데 좀 더 생각해 볼게요."], "key": ["해지 이유를 끝까지 듣고 숨은 불만 찾기", "이전 설치·구성 조정 등 현실적인 대안 제시하기", "결정을 존중하면서 계속 이용할 이유 전하기"]},

 {"id": "theft", "g": "불만", "ic": "🕵️", "title": "도난 사고 후 책임 추궁", "lv": "상", "persona": "매장에 도둑이 들어 금고의 현금과 물품을 잃었다. 경보는 울렸지만 범인은 이미 달아난 뒤였다. '돈 내고 보안 맡겼는데 이게 뭐냐'며 회사 책임과 보상을 강하게 요구한다. 충격과 분노가 크다. 확답할 수 없는 보상 약속을 하면 나중에 더 큰 문제가 되고, 책임을 피하는 말을 하면 폭발한다. 피해 공감, 사실 확인 절차와 보상 접수 절차를 차분히 안내받으면 조금 진정한다.", "open": "도둑이 들어서 가게가 다 털렸어요! 보안 맡겨 놨더니 이게 뭡니까? 에스원이 다 책임져요!", "demo": ["경보가 울렸으면 잡았어야죠. 도대체 뭘 한 거예요?", "그래서 보상은 해 주는 거예요, 안 해 주는 거예요?", "절차가 어떻게 되는지 똑바로 말해 봐요."], "key": ["피해에 대한 충격과 속상함을 충분히 공감하기", "확답 못 할 보상 약속은 하지 않고 확인 절차 안내하기", "출동 기록 확인·보상 접수 등 다음 단계를 명확히 말하기"]},

/* ───────── 나의 약한 항목 — 최근 10번 항목별 평균, 약한 항목에 맞는 상황 추천 ───────── */
var FOCUS = {"공감·사과":["rude","theft","false-alarm","r-keyman"],"원인 설명":["bill","cctv","r-multi","r-animal"],"해결책 제시":["repeat-fault","no-show","delay","r-wrongnum"],"해지 방어":["cancel","s-renew","s-price","r-animal"]};
function mineKey(){ return "rp_mine_"+ME; }
function getMine(){ try{ return JSON.parse(localStorage.getItem(mineKey())||"null"); }catch(e){ return null; } }
function addMine(sc,scores){
  var m=getMine()||{list:[]}; m.list=(m.list||[]).concat([{id:sc.id,s:CATS.map(function(c){return +scores[c]||0;})}]).slice(-10);
  try{ localStorage.setItem(mineKey(),JSON.stringify(m)); }catch(e){}
}
function mineAvg(){
  var m=getMine(); if(m&&m.srv&&(!m.list||m.list.length<m.srv.n)) return {n:m.srv.n,avg:m.srv.avg,done:m.srv.done||[]};
  var L=(m&&m.list)||[]; if(!L.length) return null;
  return {n:L.length,avg:CATS.map(function(c,i){ return Math.round(L.reduce(function(a,x){return a+x.s[i];},0)/L.length); }),done:L.map(function(x){return x.id;})};
}
function loadMine(){

    if(!j||!j.ok||!j.n) return; var m=getMine()||{list:[]}; m.srv={n:j.n,avg:j.avg,done:j.done}; try{ localStorage.setItem(mineKey(),JSON.stringify(m)); }catch(e){} drawWeak();
  }).catch(function(){});
}

    '<p class="wk-h">💡 <b>'+cat+'</b> 연습하기 좋은 상황</p>'+

/* ───────── 2. 음성 대화 ───────── */
var rec=null, recOn=false;
function start(sc){
  warm();
  rpLog("시작 · "+sc.title+" ("+S.lv+")");
  S.sc=sc; S.hist=[{r:"c",t:sc.open}]; S.turns=0; S.end=false; S.busy=false; S.fb=false; S.fbTold=false;
  $("#ttl").textContent=sc.ic+" "+sc.title.replace(/^\[영업\]\s*/,"");
  app.innerHTML='<div class="bar"><span class="pill">난이도 '+S.lv+'</span><span class="pill" id="sp" role="button">🔊 소리 켬</span></div><details class="keys"><summary>💡 이 상황의 응대 포인트 보기</summary><ol>'+sc.key.map(function(k){return '<li>'+esc(k)+'</li>';}).join("")+'</ol></details><div class="chat" id="chat"></div>';
  $("#sp").onclick=function(){ S.voice=!S.voice; $("#sp").textContent=S.voice?"🔊 소리 켬":"🔇 소리 끔"; if(!S.voice) stopSpeak(); };
  addB("c",sc.open); speak(sc.open); drawDock();
}
function addB(r,t){ var d=document.createElement("div"); d.className="b "+r; d.textContent=t; $("#chat").appendChild(d); scrollEnd(); }
function addTip(t){ var d=document.createElement("div"); d.className="tip"; d.textContent="💡 코치 팁 · "+t; $("#chat").appendChild(d); scrollEnd(); }
/* 아래 고정 입력창 높이만큼 여백을 줘서 마지막 말풍선이 가려지지 않게 */
function fitDock(){ var m=document.querySelector("main"); m.style.paddingBottom = dock.classList.contains("hidden") ? "" : (dock.offsetHeight+28)+"px"; }
window.addEventListener("resize",function(){ fitDock(); });
function scrollEnd(){ fitDock(); window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"}); }
function drawDock(){
  dock.classList.remove("hidden");
  var SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  dock.innerHTML='<div class="in">'+(SR?'<button type="button" class="mic" id="mic">🎤 눌러서 말하기</button>':'')+
    '<div class="row"><input id="tx" placeholder="'+(SR?'말이 안 되면 여기에 입력':'여기에 답변을 입력')+'" enterkeyhint="send"><button type="button" class="btn" id="go">보내기</button></div>'+
    '<div class="row" style="margin-top:8px"><button type="button" class="btn ghost" id="fin" style="flex:1">마무리하고 점수 받기</button></div></div>';
  fitDock();
  $("#go").onclick=function(){ send($("#tx").value); };
  $("#tx").addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); send($("#tx").value); } });
  $("#fin").onclick=finish;
  var m=$("#mic"); if(m) m.onclick=function(){ toggleMic(SR,m); };
}
function toggleMic(SR,btn){
  if(S.busy) return;
  if(recOn&&rec){ try{rec.stop();}catch(e){} return; }
  stopSpeak();
  try{
    rec=new SR(); rec.lang="ko-KR"; rec.interimResults=true; rec.continuous=false; var got="";
    rec.onstart=function(){ recOn=true; btn.classList.add("on"); btn.textContent="🔴 듣는 중… (다 말하면 한 번 더 누르기)"; };
    rec.onresult=function(e){ got=""; for(var i=0;i<e.results.length;i++) got+=e.results[i][0].transcript; $("#tx").value=got; };
    rec.onerror=function(e){ recOn=false; btn.classList.remove("on"); btn.textContent="🎤 눌러서 말하기"; if(e.error==="not-allowed") alert("마이크 사용을 허용해야 말로 대답할 수 있어요. 지금은 글자로 입력해 주세요."); };
    rec.onend=function(){ recOn=false; btn.classList.remove("on"); btn.textContent="🎤 눌러서 말하기"; if(got.trim()) send(got); };
    rec.start();
  }catch(e){ alert("이 기기에서는 음성 입력을 쓸 수 없어요. 글자로 입력해 주세요."); }
}
function send(t){
  t=String(t||"").trim(); if(!t||S.busy||S.end) return;
  $("#tx").value=""; S.busy=true; S.turns++; S.hist.push({r:"s",t:t}); addB("s",t);
  var ty=document.createElement("div"); ty.className="typing"; var t0=Date.now(); ty.textContent="고객이 말하는 중…"; $("#chat").appendChild(ty); scrollEnd(); var iv=setInterval(function(){ ty.textContent="고객이 말하는 중… "+Math.round((Date.now()-t0)/1000)+"초"+((Date.now()-t0)>12000?" (AI가 오래 걸리고 있어요)":""); },1000);
  var p = RP_API ? api({act:"chat",sc:{id:S.sc.id,title:S.sc.title,persona:S.sc.persona+(S.sc.g==="영업"?" (이 통화는 불만 접수가 아니라 영업 상담이다. 고객은 화나 있지 않고 망설이는 중이다.)":"")},level:S.lv,hist:S.hist}) : Promise.resolve(demoChat(t));
  p.then(function(j){
    clearInterval(iv); ty.remove(); S.hist.push({r:"c",t:j.customer}); addB("c",j.customer); if(j.tip) addTip(j.tip); speak(j.customer);
    if(j.end||S.turns>=8){ S.end=true; var d=document.createElement("div"); d.className="tip"; d.textContent="통화가 마무리됐어요. 아래 '마무리하고 점수 받기'를 눌러 주세요."; $("#chat").appendChild(d); scrollEnd(); }
  }).catch(function(e){ clearInterval(iv); ty.remove();
    /* AI가 답을 못 하면 멈추지 않고 연습용 대사로 이어 감 */
    S.fb=true; var j=demoChat(t); if(!S.fbTold){ S.fbTold=true; var d=document.createElement("div"); d.className="tip"; d.textContent="⚠️ AI가 지금 답하지 못해 연습용 대사로 이어 가요 ("+String(e.message||e).slice(0,60)+")"; $("#chat").appendChild(d); }
    S.hist.push({r:"c",t:j.customer}); addB("c",j.customer); if(j.tip) addTip(j.tip); speak(j.customer);
    if(j.end||S.turns>=8){ S.end=true; } })
  .then(function(){ S.busy=false; });
}
/* 데모 모드 */
function demoChat(t){
  var L=S.sc.demo, i=Math.min(S.turns-1,L.length-1), tip="";
  if(!/죄송|불편|걱정|놀라|송구/.test(t)&&S.turns===1) tip="먼저 불편을 받아 주고 사과해 보세요";
  else if(/모르|어쩔 수|규정상|안 돼/.test(t)) tip="'모른다·안 된다'보다 할 수 있는 일을 말해 보세요";
  return {customer:L[i],tip:tip,end:S.turns>=L.length+1};
}
function demoEval(){
  var s=S.hist.filter(function(m){return m.r==="s";}).map(function(m){return m.t;}).join(" ");
  var re=[/죄송|불편|걱정|놀라|송구|마음/,/원인|때문|점검|확인해|이유|오작동|센서/,/출동|방문|조치|안내|교체|보상|바로|오늘|내일|약속/,/도움|유지|혜택|조정|할인|다시|이전|대안|계속/];
  var sc=re.map(function(r){ var n=(s.match(new RegExp(r.source,"g"))||[]).length; return Math.min(90,35+n*14+(s.length>60?6:0)); });
  var o={}; CATS.forEach(function(c,i){ o[c]=s.length<8?30:sc[i]; });
  var tot=Math.round(CATS.reduce(function(a,c){return a+o[c];},0)/4);
  return {ok:true,total:tot,scores:o,good:["끝까지 대화를 이어 갔어요","답변을 직접 말로 해 봤어요"],improve:["감정을 먼저 받아 주는 한마디를 더해 보세요","'언제까지 무엇을 하겠다'를 구체적으로 말해 보세요"],example:"불편을 드려 정말 죄송합니다. 원인을 바로 확인하고, 오늘 안에 기사가 방문해 조치해 드리겠습니다.",prev:null,demo:true};
}

   CATS.map(function(c){ var v=j.scores[c]||0; return '<div class="it'+(v<60?' lo':'')+'"><div><span>'+c+'</span><span>'+v+'점</span></div><u><i style="width:'+v+'%"></i></u></div>'; }).join("")+'</div>'+

  app.innerHTML='<div class="card"><h2>불러오는 중…</h2></div>';

    fetch(RP_API+"?action=rows&pin="+encodeURIComponent(pin)+"&t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json();}),
    fetch(PUSH_URL+"?action=names&pin="+encodeURIComponent(pin)+"&t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json();}).catch(function(){return null;})
  ]).then(function(a){
    if(!a[0]||!a[0].ok){ try{sessionStorage.removeItem("rp_pin");}catch(e){} throw new Error(a[0]&&a[0].err==="pin"?"비밀번호가 맞지 않아요":"불러오지 못했어요"); }
    try{ sessionStorage.setItem("rp_pin",pin); }catch(e){}
    drawAdmin(a[0].rows||[], a[1]&&a[1].names||[]);
  }).catch(function(e){ app.innerHTML='<div class="card"><h2>🔒 파트장 현황</h2><p class="sub">'+esc(e.message||e)+'</p><button class="btn red block" id="rt">다시 시도</button><button class="btn ghost block" id="hm">돌아가기</button></div>'; $("#rt").onclick=admin; $("#hm").onclick=home; });
}
function ym(t){ var d=new Date(t+9*36e5); return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0"); }
function drawAdmin(rows,names){
  var staff=names.filter(function(n){return MGR.indexOf(n)<0;});
  var cur=ym(Date.now()), by={};
  rows.forEach(function(r){ var m=ym(r.t); (by[m]=by[m]||[]).push(r); });
  var now=by[cur]||[], who={}; now.forEach(function(r){who[r.name]=1;});
  var part=Object.keys(who).length, avg=now.length?Math.round(now.reduce(function(a,r){return a+r.total;},0)/now.length):0;
  var miss=staff.filter(function(n){return !who[n];});
  var sa={}; now.forEach(function(r){ (sa[r.sc]=sa[r.sc]||[]).push(r.total); });
  var wk=null; Object.keys(sa).forEach(function(k){ var v=sa[k].reduce(function(a,b){return a+b;},0)/sa[k].length; if(!wk||v<wk.v) wk={k:k,v:Math.round(v)}; });
  var wt=wk?(SCEN.filter(function(c){return c.id===wk.k;})[0]||{title:wk.k}).title:"-";
  var ms=Object.keys(by).sort().slice(-4);
  var h='<div class="card"><h2>🔒 파트장 현황 <small style="font-weight:400;color:var(--mute)">'+cur+'</small></h2>'+
   '<div class="k3"><div><span>이번 달 참여</span><b>'+part+(staff.length?'/'+staff.length:'')+'</b></div><div><span>평균 점수</span><b>'+(now.length?avg:"-")+'</b></div><div><span>연습 횟수</span><b>'+now.length+'</b></div></div>'+
   '<p class="sub" style="margin:8px 0 0">가장 약한 상황: <b>'+esc(wt)+'</b>'+(wk?' (평균 '+wk.v+'점)':'')+'</p></div>'+
   '<div class="card"><h2>월별 평균 점수 변화</h2>'+(ms.length?'<table><tr><th>월</th><th>참여</th><th>횟수</th><th>평균</th></tr>'+ms.map(function(m){ var r=by[m],p={}; r.forEach(function(x){p[x.name]=1;}); return '<tr><td>'+m+'</td><td>'+Object.keys(p).length+'명</td><td>'+r.length+'</td><td><b>'+Math.round(r.reduce(function(a,x){return a+x.total;},0)/r.length)+'</b></td></tr>'; }).join("")+'</table>':'<p class="sub">아직 기록이 없어요.</p>')+'</div>'+
   '<div class="card"><h2>이번 달 미참여 '+(staff.length?miss.length+'명':'')+'</h2>'+(staff.length?(miss.length?miss.map(function(n){return '<span class="chip">'+esc(n)+'</span>';}).join(""):'<p class="sub">모두 참여했어요 👏</p>'):'<p class="sub">직원 명단을 불러오지 못했어요.</p>')+'</div>'+
   '<button class="btn ghost block" id="hm">돌아가기</button>';
  app.innerHTML=h; $("#hm").onclick=home;
}

/* ───────── 시작 ───────── */
function goReport(){ stopSpeak(); location.href="./"; }
back.onclick=function(){ if(S.sc&&dock&&!dock.classList.contains("hidden")){ if(!confirm("연습을 멈추고 나갈까요? (점수는 저장되지 않아요)")) return; } if($("#ttl").textContent.indexOf("AI 응대 연습")>=0) goReport(); else home(); };
home();
</script>
